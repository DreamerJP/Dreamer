<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Dreamer</title>
  <meta name="robots" content="noindex" />
  <!-- Caminhos absolutos a partir da raiz do site: o GitHub entrega esta pagina
       no endereco errado que o visitante digitou, entao caminho relativo quebra. -->
  <link rel="icon" type="image/x-icon" href="/Dreamer/Assets/Home/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #08070c;
      --ink: #edeae3;
      --ink-dim: #a8a59c;
      --ink-faint: #65635c;
      --accent: oklch(0.82 0.13 195);
      --serif: "Fraunces", "Times New Roman", serif;
      --sans: "Space Grotesk", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      cursor:
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26"><path d="M2 2l20 10-8 2-2 8z" fill="%23e0e0e0" stroke="%23666666"/><path d="M2 2l18 9-7 1.8-1.8 7z" fill="%23ffffff" stroke="%23999999" stroke-width="0.5"/></svg>'),
        auto;
    }

    @media (max-width: 768px),
    (hover: none) {
      body {
        cursor: auto;
      }
    }

    /* ─── grain ─────────────────────── */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 200;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="200" height="200" filter="url(%23n)"/></svg>');
    }

    .bg-image {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url('/Dreamer/Assets/Home/background.jpg') center center / cover no-repeat;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 30%, oklch(0.82 0.13 195 / 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, oklch(0.74 0.17 28 / 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.7) 100%);
    }

    /* ─── nav ──────────────────────── */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-dim);
      mix-blend-mode: difference;
    }

    .nav-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
    }

    .nav-mark::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.8);
      }
    }

    /* ─── conteudo ─────────────────── */
    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
    }

    .tag {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
    }

    .code {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(5rem, 20vw, 15rem);
      line-height: 0.85;
      letter-spacing: -0.05em;
      color: var(--ink);
    }

    .code em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    .message {
      margin-top: 32px;
      max-width: 46ch;
      font-size: 15px;
      font-weight: 300;
      color: var(--ink-dim);
    }

    .back {
      margin-top: 44px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 16px 32px;
      background: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--bg);
      text-decoration: none;
      border: 1px solid var(--ink);
      border-radius: 999px;
      transition: gap 0.3s ease, background 0.3s ease, color 0.3s ease, transform 0.3s ease;
    }

    .back:hover {
      gap: 22px;
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .back:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .rooms {
      margin-top: 56px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 24px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .rooms a {
      color: var(--ink-faint);
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .rooms a:hover,
    .rooms a:focus-visible {
      color: var(--ink);
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 768px) {
      .nav {
        padding: 18px 20px;
      }

      .nav-meta {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="bg-image" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <nav class="nav">
    <div class="nav-mark">DREAMER / JP</div>
    <div class="nav-meta"><span>Sinal perdido</span></div>
  </nav>

  <main>
    <div class="tag">[ Fora do mapa ]</div>

    <h1 class="code">4<em>0</em>4</h1>

    <p class="message">
      Esta página não existe, ou existia e a névoa levou. Volte para o começo e
      escolha outro caminho.
    </p>

    <a class="back" href="/Dreamer/">
      <span>Voltar ao início</span>
    </a>

    <nav class="rooms" aria-label="Seções do arquivo">
      <a href="/Dreamer/animes.html">Animes</a>
      <a href="/Dreamer/filmes.html">Filmes</a>
      <a href="/Dreamer/jogos.html">Jogos</a>
      <a href="/Dreamer/musicas.html">Músicas</a>
      <a href="/Dreamer/imagens.html">Imagens</a>
      <a href="/Dreamer/videos.html">Vídeos</a>
      <a href="/Dreamer/dreamer.html">Dreamer</a>
    </nav>
  </main>
</body>

</html>
