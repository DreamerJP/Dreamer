<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamer</title>
  <link rel="icon" type="image/x-icon" href="./Assets/Home/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&family=Rock+Salt&display=swap"
    rel="stylesheet" />

  <style>
    /* ============================================================
       1 · TOKENS
       ============================================================ */
    :root {
      --bg: #04050a;
      --ink: #d9d3c5;
      --ink-dim: #8b8478;
      --ink-faint: #4c483f;
      --line: rgba(217, 211, 197, 0.10);
      --line-strong: rgba(217, 211, 197, 0.22);

      /* trocados pela fase ativa */
      --accent: #c2703f;
      --tint-a: rgba(150, 96, 52, 0.18);
      --tint-b: rgba(64, 58, 74, 0.16);
      --grain: 0.05;

      --serif: "EB Garamond", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      /* Usada so pela legenda, para nao se confundir com o texto dos fragmentos. */
      --canto: "Cormorant Garamond", "EB Garamond", Georgia, serif;

      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }


    /* ============================================================
       2 · BASE
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    /* Trava a rolagem enquanto o leitor esta aberto. */
    html.held {
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      cursor: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    /* O halo faz as vezes de cursor; a seta do sistema volta so onde ha o que
       operar. Sobre um fragmento nem isso: a mira ja virou a forma dele. */
    .sheet .link,
    .reader {
      cursor: pointer;
    }

    .reader,
    .sheet {
      cursor: default;
    }

    .marker.on {
      cursor: none;
    }

    ::selection {
      background: var(--accent);
      color: #06070c;
    }

    /* ============================================================
       3 · PALCO
       ============================================================ */
    /* O filtro cobre cena e camadas de uma vez, sem repintar cada uma. */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      transition: filter 900ms var(--ease);
      filter: sepia(0.3) saturate(0.75) contrast(1.05) brightness(0.98);
    }


    .scene {
      position: absolute;
      inset: 0;
      animation: respiro 26s ease-in-out infinite alternate;
    }

    @keyframes respiro {
      from {
        transform: scale(1.004) translate3d(-0.25%, 0.15%, 0);
      }

      to {
        transform: scale(1.014) translate3d(0.3%, -0.2%, 0);
      }
    }

    /* ============================================================
       4 · CAMADAS
       ============================================================ */
    /* A peca repetida e desenhada pelo proprio navegador, num elemento so.
       Fatiar em filhos multiplica a area promovida a GPU e trava o quadro. */
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      background-repeat: repeat-x;
      will-change: transform;
    }

    /* Brilho sobre a lampada da arte, repetido junto com a peca. */
    .layer .lampada {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      background: radial-gradient(circle closest-side,
          rgba(255, 196, 128, 0.55) 0%,
          rgba(255, 172, 92, 0.2) 24%,
          rgba(255, 150, 70, 0.05) 48%,
          transparent 72%);
      animation: tremeluz 5.7s linear infinite;
    }

    /* Passos irregulares: contato ruim tem tremor, nao pulso. */
    @keyframes tremeluz {
      0% {
        opacity: 0.92;
      }

      7% {
        opacity: 0.58;
      }

      11% {
        opacity: 1;
      }

      13% {
        opacity: 0.34;
      }

      16% {
        opacity: 0.88;
      }

      35% {
        opacity: 0.95;
      }

      37% {
        opacity: 0.46;
      }

      39% {
        opacity: 0.9;
      }

      58% {
        opacity: 0.83;
      }

      60% {
        opacity: 1;
      }

      63% {
        opacity: 0.22;
      }

      66% {
        opacity: 0.86;
      }

      84% {
        opacity: 0.94;
      }

      86% {
        opacity: 0.6;
      }

      100% {
        opacity: 0.92;
      }
    }

    /* ============================================================
       5 · QUARTOS ATRAS DA PAREDE
       ============================================================ */
    /* Cobre so a camada dos quartos, porque a parede e desenhada depois.
       O furo acompanha a lanterna; fora dele o comodo nao existe. */
    .veu {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at var(--lx, -999px) var(--ly, -999px),
          transparent 0px,
          transparent 14px,
          rgba(4, 5, 10, 0.6) 48px,
          #04050a 96px);
    }

    /* ============================================================
       6 · POEIRA
       ============================================================ */
    .dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Marcas riscadas no reboco: vivem na cena, entre a parede e o entulho. */
    .marca {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* ============================================================
       7 · LANTERNA
       ============================================================ */
    /* Fica dentro da cena e atras do primeiro plano: o entulho corta a luz. */
    .lume {
      position: absolute;
      top: 0;
      left: 0;
      width: 38vmax;
      height: 38vmax;
      margin: -19vmax 0 0 -19vmax;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 900ms var(--ease);
      background: radial-gradient(circle closest-side,
          rgba(255, 233, 198, 0.2) 0%,
          rgba(255, 214, 160, 0.12) 20%,
          rgba(255, 196, 130, 0.05) 44%,
          rgba(255, 180, 110, 0.015) 66%,
          transparent 82%);
    }

    .lume.on {
      opacity: 1;
    }

    /* Ponto nitido no lugar exato do ponteiro: o halo e amortecido demais para
       servir de mira sozinho. */
    .ponta {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 300ms var(--ease);
    }

    .ponta.on {
      opacity: 1;
    }

    /* O deslocamento fica no pai e a forma no filho: a posicao e reescrita a
       cada movimento e apagaria a rotacao se estivessem no mesmo transform. */
    .ponta i {
      display: block;
      width: 5px;
      height: 5px;
      margin: -2.5px 0 0 -2.5px;
      border-radius: 50%;
      background: rgba(255, 232, 198, 0.75);
      box-shadow: 0 0 7px 1px rgba(255, 198, 130, 0.55);
      transition: width 280ms var(--ease), height 280ms var(--ease),
        margin 280ms var(--ease), border-radius 280ms var(--ease),
        transform 280ms var(--ease), background 280ms var(--ease),
        box-shadow 280ms var(--ease);
    }

    /* Sobre um fragmento alcancavel a mira assume a forma dele. */
    .ponta.achou i {
      width: 13px;
      height: 13px;
      margin: -6.5px 0 0 -6.5px;
      border-radius: 0;
      transform: rotate(45deg);
      background: var(--accent);
      box-shadow: 0 0 18px 4px var(--accent);
    }

    /* ============================================================
       8 · ATMOSFERA
       ============================================================ */
    .haze {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 22% 62%, var(--tint-a) 0%, transparent 62%),
        radial-gradient(ellipse 60% 45% at 78% 40%, var(--tint-b) 0%, transparent 60%);
      transition: background 900ms var(--ease);
      animation: drift 34s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from {
        transform: translate3d(-2%, 1%, 0) scale(1.04);
      }

      to {
        transform: translate3d(3%, -2%, 0) scale(1.1);
      }
    }

    .edge {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 24%, rgba(0, 0, 0, 0.55) 72%, rgba(0, 0, 0, 0.92) 100%);
      animation: breathe 11s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.86;
      }

      50% {
        opacity: 1;
      }
    }

    .edge::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: var(--grain);
      mix-blend-mode: overlay;
      transition: opacity 900ms var(--ease);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/></filter><rect width="180" height="180" filter="url(%23n)"/></svg>');
    }

    /* ============================================================
       9 · FRAGMENTOS
       ============================================================ */
    .markers {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .marker {
      position: absolute;
      width: 128px;
      height: 128px;
      margin: -64px 0 0 -64px;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
    }

    .marker.on {
      pointer-events: auto;
    }

    /* Escritos a cada quadro pelo laco; sem transicao, para que o movimento
       venha da rolagem e nao de uma animacao concorrente. */
    .marker .glyph {
      position: relative;
      width: 9px;
      height: 9px;
      background: var(--accent);
      transform: rotate(45deg) scale(calc(0.35 + var(--f, 0) * 0.9));
      box-shadow: 0 0 calc(16px * var(--f, 0)) calc(3px * var(--f, 0)) var(--accent);
      transition: background 900ms var(--ease);
    }

    .marker .glyph::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 96px;
      margin: -48px 0 0 -0.5px;
      transform: rotate(-45deg);
      background: linear-gradient(180deg, transparent, var(--accent), transparent);
      opacity: calc(var(--f, 0) * 0.5);
    }

    .marker .tag {
      position: absolute;
      top: calc(50% + 26px);
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--ink);
      opacity: calc(var(--f, 0) * var(--f, 0));
      transition: color 260ms var(--ease);
    }

    .marker.seen .glyph {
      background: var(--ink-faint);
      box-shadow: none;
    }

    .marker.seen .tag {
      color: var(--ink-dim);
    }

    /* Com o ponteiro em cima a forma migra para a mira e o nome deixa de
       depender da proximidade do centro. */
    .marker.pego .glyph {
      opacity: 0;
      transition: opacity 240ms var(--ease);
    }

    .marker.pego .tag {
      opacity: 1;
      color: var(--ink);
      transition: opacity 240ms var(--ease), color 240ms var(--ease);
    }

    /* ============================================================
       10 · CABECALHO
       ============================================================ */
    /* Altura rolavel; a cena nao rola junto, ela e traduzida pelo progresso. */
    .track {
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 26px 34px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      pointer-events: none;
    }

    .top .title {
      color: var(--ink-dim);
      /* O cabecalho inteiro e transparente ao ponteiro; so o titulo recebe. */
      pointer-events: auto;
    }

    .top .right {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      transition: border-color 300ms var(--ease), color 300ms var(--ease);
    }

    .switch:hover {
      border-color: var(--line-strong);
      color: var(--ink);
    }


    .switch .wave {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 9px;
    }

    .switch .wave i {
      width: 2px;
      height: 3px;
      background: var(--ink-faint);
      transition: background 300ms var(--ease);
    }

    #sound[aria-pressed="true"] .wave i {
      background: var(--accent);
      animation: pulse 1.1s ease-in-out infinite;
    }

    #sound[aria-pressed="true"] .wave i:nth-child(2) {
      animation-delay: 0.22s;
    }

    #sound[aria-pressed="true"] .wave i:nth-child(3) {
      animation-delay: 0.44s;
    }

    @keyframes pulse {

      0%,
      100% {
        height: 3px;
      }

      50% {
        height: 9px;
      }
    }

    /* ============================================================
       11 · TRILHO DE PROGRESSO
       ============================================================ */
    .rail {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 20;
      width: min(520px, 62vw);
      height: 26px;
      pointer-events: none;
    }

    .rail .bar {
      position: absolute;
      top: 13px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--line);
    }

    .rail .fill {
      position: absolute;
      top: 13px;
      left: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent));
      transition: background 900ms var(--ease);
    }

    .rail .pip {
      position: absolute;
      top: 10px;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      border: 1px solid var(--ink-faint);
      transform: rotate(45deg);
      background: var(--bg);
      transition: background 400ms var(--ease), border-color 400ms var(--ease);
    }

    .rail .pip.seen {
      background: var(--ink-faint);
      border-color: var(--ink-faint);
    }

    .rail .pip.near {
      border-color: var(--accent);
      background: var(--accent);
    }

    .rail .hint {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-faint);
      transition: opacity 700ms var(--ease);
    }

    /* ============================================================
       12 · ANDAMENTO DO SOM
       ============================================================ */
    .scrub {
      position: fixed;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 15;
      width: 38px;
      height: 46vh;
      opacity: 0.4;
      transition: opacity 500ms var(--ease);
      touch-action: none;
      cursor: grab;
    }

    .scrub:hover,
    .scrub.puxando {
      opacity: 1;
    }

    .scrub.puxando {
      cursor: grabbing;
    }

    .scrub svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .scrub .resto {
      stroke: var(--ink-faint);
      stroke-width: 1.4;
      opacity: 0.5;
    }

    .scrub .feito {
      stroke: var(--accent);
      stroke-width: 1.6;
      transition: stroke 900ms var(--ease);
      filter: drop-shadow(0 0 4px var(--accent));
    }

    .scrub .pega {
      fill: var(--accent);
      opacity: 0;
      transition: opacity 320ms var(--ease), fill 900ms var(--ease);
      filter: drop-shadow(0 0 6px var(--accent));
    }

    .scrub:hover .pega,
    .scrub.puxando .pega {
      opacity: 1;
    }

    /* ============================================================
       13 · LEGENDA
       ============================================================ */
    /* Faixa vertical fixa: limita a estrofe ao viewport qualquer que seja a
       altura do bloco. */
    .lyric {
      position: fixed;
      z-index: 10;
      top: 13vh;
      bottom: 13vh;
      width: min(30ch, 42vw);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: none;
      font-family: var(--canto);
      font-weight: 300;
      font-style: italic;
      font-size: clamp(22px, 2.6vw, 34px);
      line-height: 1.35;
      letter-spacing: 0.01em;
      color: var(--ink-dim);
      text-shadow: 0 0 30px rgba(4, 5, 10, 0.95), 0 2px 4px rgba(4, 5, 10, 0.85);
      opacity: 0;
      filter: blur(4px);
      transform: translateY(10px);
      transition: opacity 800ms var(--ease), filter 800ms var(--ease), transform 800ms var(--ease);
    }

    .lyric.on {
      opacity: 1;
      filter: none;
      transform: none;
    }

    .lyric.oculta {
      opacity: 0 !important;
      filter: blur(4px) !important;
    }

    .lyric.esq {
      left: 6vw;
      align-items: flex-start;
      text-align: left;
    }

    .lyric.dir {
      right: 6vw;
      align-items: flex-end;
      text-align: right;
    }

    .lyric.acima {
      justify-content: flex-start;
    }

    .lyric.abaixo {
      justify-content: flex-end;
    }

    .lyric.meio {
      justify-content: center;
    }

    .lyric p {
      margin-bottom: 0.2em;
      /* Reparte o verso em linhas parecidas em vez de deixar uma palavra sozinha. */
      text-wrap: balance;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 520ms var(--ease), transform 520ms var(--ease), color 520ms var(--ease);
    }

    .lyric p.viva {
      opacity: 0.92;
      transform: none;
      color: var(--ink);
    }

    .lyric p.passou {
      opacity: 0.34;
      transform: none;
    }

    /* Fora da janela sai do fluxo: sem isso a estrofe cresce alem da faixa. */
    .lyric p.fora {
      display: none;
    }

    .lyric[data-tema="vozes"] {
      width: min(26ch, 38vw);
      font-style: normal;
      font-size: clamp(21px, 2.4vw, 31px);
      line-height: 1.85;
      letter-spacing: 0.09em;
    }

    .lyric[data-tema="vozes"] p {
      margin-bottom: 0;
    }

    /* Largo o bastante para os versos longos nao quebrarem em tres linhas. */
    .lyric[data-tema="carta"] {
      width: min(34ch, 46vw);
      font-size: clamp(21px, 2.4vw, 31px);
      line-height: 1.28;
    }


    .lyric[data-tema="carta"] p:first-child {
      color: var(--accent);
      transition: color 900ms var(--ease);
    }

    /* ============================================================
       14 · LEITOR
       ============================================================ */
    .reader {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 7vh 24px;
      background: rgba(4, 5, 10, 0.82);
      backdrop-filter: blur(14px) saturate(0.7);
      -webkit-backdrop-filter: blur(14px) saturate(0.7);
      opacity: 0;
      visibility: hidden;
      transition: opacity 520ms var(--ease), visibility 520ms;
    }

    .reader.open {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      position: relative;
      width: min(640px, 100%);
      max-height: 86vh;
      overflow-y: auto;
      padding: 8px 4px 40px;
      overscroll-behavior: contain;
      transform: translateY(18px);
      transition: transform 620ms var(--ease);
      scrollbar-width: thin;
      scrollbar-color: var(--ink-faint) transparent;
    }

    .reader.open .sheet {
      transform: none;
    }

    .sheet::-webkit-scrollbar {
      width: 3px;
    }

    .sheet::-webkit-scrollbar-thumb {
      background: var(--ink-faint);
    }

    .sheet .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .sheet .meta .kind {
      color: var(--accent);
      transition: color 900ms var(--ease);
    }

    .sheet .meta .draft {
      padding: 2px 7px;
      border: 1px dashed var(--line-strong);
      color: var(--ink-faint);
      letter-spacing: 0.18em;
    }

    .sheet h2 {
      margin-bottom: 30px;
      font-weight: 500;
      font-size: clamp(30px, 5.4vw, 46px);
      line-height: 1.12;
      letter-spacing: -0.015em;
    }

    .sheet p {
      margin-bottom: 22px;
      font-size: clamp(17px, 2.1vw, 19px);
      line-height: 1.78;
      color: var(--ink);
      opacity: 0;
      transform: translateY(8px);
      animation: rise 900ms var(--ease) forwards;
      animation-delay: calc(220ms + var(--i) * 340ms);
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: none;
      }
    }

    .sheet .link {
      position: relative;
      padding: 0 1px;
      color: var(--ink);
      border-bottom: 1px solid var(--accent);
      transition: color 260ms var(--ease), background 260ms var(--ease);
    }

    .sheet .link:hover {
      background: var(--accent);
      color: #06070c;
    }

    .sheet .again {
      margin-top: 34px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .close {
      position: fixed;
      top: 24px;
      right: 30px;
      z-index: 41;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: var(--ink-faint);
      font-size: 20px;
      line-height: 1;
      opacity: 0;
      visibility: hidden;
      transition: opacity 420ms var(--ease), visibility 420ms, color 260ms var(--ease);
    }

    .reader.open~.close {
      opacity: 1;
      visibility: visible;
    }

    .close:hover {
      color: var(--ink);
    }

    /* ============================================================
       15 · ESTADO ANTERIOR
       ============================================================ */
    /* A mesma parede antes da ruina. Desenhada como as camadas da cena, com a
       mesma altura, repeticao e origem, para registrar com ela na dissolucao. */
    .novo {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      /* Sem repeticao: a emenda da peca aparece demais na parede limpa. */
      background-repeat: no-repeat;
      background-position: 0 0;
      background-image: url('./Assets/Dreamer/camadas/a-novo.jpg');
    }

    /* A queima e desenhada, nao mascarada: borda dura irregular, brasa acesa e
       papel tostando pedem controle por pixel que gradiente de CSS nao da. */
    .fogo {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Enquanto queima o percurso fica parado: a chama esta presa a tela. */
    html.queimando {
      overflow: hidden;
    }

    /* Fora da camada, senao andaria junto com a parede ao percorrer o corredor. */
    .convite {
      position: fixed;
      left: 50%;
      bottom: 11vh;
      z-index: 5;
      transform: translateX(-50%);
      pointer-events: none;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      white-space: nowrap;
      color: rgba(214, 218, 226, 0.5);
      animation: fade 3.2s ease-in-out infinite;
    }

    html:not(.antes) .convite {
      opacity: 0;
      animation: none;
      transition: opacity 320ms var(--ease);
    }

    /* Nada da travessia existe antes de entrar, e o corredor inteiro esta aceso:
       nao ha lanterna para carregar, entao o cursor do sistema volta. */
    html.antes body {
      cursor: auto;
    }

    html.antes .ponta,
    html.antes .scrub,
    html.antes .lyric,
    html.antes .rail,
    html.antes #sound {
      display: none;
    }

    /* ============================================================
       16 · ABERTURA E AVISOS
       ============================================================ */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: var(--bg);
      transition: opacity 1400ms var(--ease), visibility 1400ms;
    }

    .veil.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .veil span {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--ink-faint);
      animation: fade 3.2s ease-in-out infinite;
    }

    @keyframes fade {

      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 0.8;
      }
    }

    .notice {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      background: var(--bg);
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 2;
      letter-spacing: 0.1em;
    }

    .notice code {
      color: var(--accent);
    }

    /* ============================================================
       17 · TELAS ESTREITAS E MENOS MOVIMENTO
       ============================================================ */
    @media (max-width: 760px) {
      .top {
        padding: 18px 18px;
        font-size: 9px;
      }

      .rail {
        width: 62vw;
        bottom: 22px;
      }

      .rail .hint {
        display: none;
      }

      .close {
        top: 14px;
        right: 14px;
      }

      .marker {
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
      }

      .scrub {
        display: none;
      }

      .lyric,
      .lyric[data-tema="vozes"],
      .lyric[data-tema="carta"] {
        width: 74vw;
        font-size: 21px;
      }
    }

    @media (hover: none) {
      body {
        cursor: auto;
      }

      /* O dedo ja e o ponteiro; a mira ficaria embaixo dele. */
      .ponta {
        display: none;
      }

      /* A cena anda no arrasto horizontal, no mesmo eixo em que ela se move.
         Sem travar o toque aqui o navegador disputaria o mesmo gesto. */
      body {
        touch-action: none;
      }

      /* Unico bloco que ainda rola sozinho. */
      .sheet {
        touch-action: pan-y;
      }

      /* Volta a aparecer mesmo abaixo de 760px, onde a regra por largura a
         esconde: la o alvo e a janela estreita no desktop, nao o toque.
         pan-y porque o arrasto so comeca na pega: o resto da faixa fica
         permeavel e a pagina rola normalmente por cima dela. */
      .scrub:not([hidden]) {
        display: block;
        opacity: 0.72;
        touch-action: pan-y;
      }

      /* Sem hover a pega precisa estar sempre a vista, e o traco transparente
         leva a area de toque a 44px sem engordar o desenho. */
      .scrub .pega {
        opacity: 1;
        stroke: transparent;
        stroke-width: 36;
      }

      /* No toque a faixa fica visivel e ocupa ate 52px: a estrofe ancorada a
         esquerda comecaria por cima dela. */
      .lyric.esq {
        left: 66px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .haze,
      .edge,
      .scene,
      .veil span {
        animation: none;
      }

      .sheet p {
        animation-delay: 0ms;
        animation-duration: 1ms;
      }
    }
  </style>
</head>

<body>

  <!-- As camadas sao inseridas em .scene pelo script, na ordem de pintura:
       quartos · veu · parede · poeira · lume · frente · marcadores -->
  <div class="stage" aria-hidden="true">
    <div class="scene" id="scene">
      <div class="veu" id="veu"></div>

  </div>

  <div class="novo" id="novo" aria-hidden="true"></div>

  <div class="convite" id="convite">clique para entrar</div>

  <div class="edge" aria-hidden="true"></div>

  <header class="top">
    <div class="title" id="title" role="button" tabindex="0" aria-pressed="true">Dreamer</div>
    <div class="right">

  <div class="scrub" id="scrub" hidden>

  <div class="rail" id="rail">
    <div class="bar"></div>
