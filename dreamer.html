<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamer</title>
  <link rel="icon" type="image/x-icon" href="./Assets/Home/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@300;400&display=swap"
    rel="stylesheet" />

  <style>
    /* ============================================================
       1 · TOKENS
       ============================================================ */
    :root {
      --bg: #04050a;
      --ink: #d9d3c5;
      --ink-dim: #8b8478;
      --ink-faint: #4c483f;
      --line: rgba(217, 211, 197, 0.10);
      --line-strong: rgba(217, 211, 197, 0.22);

      /* trocados pela fase ativa */
      --accent: #c2703f;
      --tint-a: rgba(150, 96, 52, 0.18);
      --tint-b: rgba(64, 58, 74, 0.16);
      --grain: 0.05;

      --serif: "EB Garamond", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      /* Usada so pela legenda, para nao se confundir com o texto dos fragmentos. */
      --canto: "Cormorant Garamond", "EB Garamond", Georgia, serif;

      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    :root[data-phase="1"] {
      --accent: #7ba07f;
      --tint-a: rgba(58, 96, 74, 0.16);
      --tint-b: rgba(30, 46, 52, 0.26);
      --grain: 0.085;
    }

    /* ============================================================
       2 · BASE
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    /* Trava a rolagem enquanto o leitor esta aberto. */
    html.held {
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      cursor: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    /* O halo faz as vezes de cursor; a seta do sistema volta so onde ha o que
       operar. Sobre um fragmento nem isso: a mira ja virou a forma dele. */
    .sheet .link,
    .reader {
      cursor: pointer;
    }

    .reader,
    .sheet {
      cursor: default;
    }

    .marker.on {
      cursor: none;
    }

    ::selection {
      background: var(--accent);
      color: #06070c;
    }

    /* ============================================================
       3 · PALCO
       ============================================================ */
    /* O filtro cobre cena e camadas de uma vez, sem repintar cada uma. */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      transition: filter 900ms var(--ease);
      filter: sepia(0.3) saturate(0.75) contrast(1.05) brightness(0.98);
    }

    :root[data-phase="1"] .stage {
      filter: sepia(0.1) saturate(0.6) contrast(1.22) brightness(0.82) hue-rotate(35deg);
    }

    .scene {
      position: absolute;
      inset: 0;
      animation: respiro 26s ease-in-out infinite alternate;
    }

    @keyframes respiro {
      from {
        transform: scale(1.004) translate3d(-0.25%, 0.15%, 0);
      }

      to {
        transform: scale(1.014) translate3d(0.3%, -0.2%, 0);
      }
    }

    /* ============================================================
       4 · CAMADAS
       ============================================================ */
    /* A peca repetida e desenhada pelo proprio navegador, num elemento so.
       Fatiar em filhos multiplica a area promovida a GPU e trava o quadro. */
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      background-repeat: repeat-x;
      will-change: transform;
    }

    /* Brilho sobre a lampada da arte, repetido junto com a peca. */
    .layer .lampada {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      mix-blend-mode: screen;
      background: radial-gradient(circle closest-side,
          rgba(255, 196, 128, 0.55) 0%,
          rgba(255, 172, 92, 0.2) 24%,
          rgba(255, 150, 70, 0.05) 48%,
          transparent 72%);
      animation: tremeluz 5.7s linear infinite;
    }

    /* Passos irregulares: contato ruim tem tremor, nao pulso. */
    @keyframes tremeluz {
      0% {
        opacity: 0.92;
      }

      7% {
        opacity: 0.58;
      }

      11% {
        opacity: 1;
      }

      13% {
        opacity: 0.34;
      }

      16% {
        opacity: 0.88;
      }

      35% {
        opacity: 0.95;
      }

      37% {
        opacity: 0.46;
      }

      39% {
        opacity: 0.9;
      }

      58% {
        opacity: 0.83;
      }

      60% {
        opacity: 1;
      }

      63% {
        opacity: 0.22;
      }

      66% {
        opacity: 0.86;
      }

      84% {
        opacity: 0.94;
      }

      86% {
        opacity: 0.6;
      }

      100% {
        opacity: 0.92;
      }
    }

    /* ============================================================
       5 · QUARTOS ATRAS DA PAREDE
       ============================================================ */
    /* Cobre so a camada dos quartos, porque a parede e desenhada depois.
       O furo acompanha a lanterna; fora dele o comodo nao existe. */
    .veu {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at var(--lx, -999px) var(--ly, -999px),
          transparent 0px,
          transparent 14px,
          rgba(4, 5, 10, 0.6) 48px,
          #04050a 96px);
    }

    /* ============================================================
       6 · POEIRA
       ============================================================ */
    .dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* ============================================================
       7 · LANTERNA
       ============================================================ */
    /* Fica dentro da cena e atras do primeiro plano: o entulho corta a luz. */
    .lume {
      position: absolute;
      top: 0;
      left: 0;
      width: 38vmax;
      height: 38vmax;
      margin: -19vmax 0 0 -19vmax;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 900ms var(--ease);
      background: radial-gradient(circle closest-side,
          rgba(255, 233, 198, 0.2) 0%,
          rgba(255, 214, 160, 0.12) 20%,
          rgba(255, 196, 130, 0.05) 44%,
          rgba(255, 180, 110, 0.015) 66%,
          transparent 82%);
    }

    .lume.on {
      opacity: 1;
    }

    /* Ponto nitido no lugar exato do ponteiro: o halo e amortecido demais para
       servir de mira sozinho. */
    .ponta {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 300ms var(--ease);
    }

    .ponta.on {
      opacity: 1;
    }

    /* O deslocamento fica no pai e a forma no filho: a posicao e reescrita a
       cada movimento e apagaria a rotacao se estivessem no mesmo transform. */
    .ponta i {
      display: block;
      width: 5px;
      height: 5px;
      margin: -2.5px 0 0 -2.5px;
      border-radius: 50%;
      background: rgba(255, 232, 198, 0.75);
      box-shadow: 0 0 7px 1px rgba(255, 198, 130, 0.55);
      transition: width 280ms var(--ease), height 280ms var(--ease),
        margin 280ms var(--ease), border-radius 280ms var(--ease),
        transform 280ms var(--ease), background 280ms var(--ease),
        box-shadow 280ms var(--ease);
    }

    /* Sobre um fragmento alcancavel a mira assume a forma dele. */
    .ponta.achou i {
      width: 13px;
      height: 13px;
      margin: -6.5px 0 0 -6.5px;
      border-radius: 0;
      transform: rotate(45deg);
      background: var(--accent);
      box-shadow: 0 0 18px 4px var(--accent);
    }

    /* ============================================================
       8 · ATMOSFERA
       ============================================================ */
    .haze {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 22% 62%, var(--tint-a) 0%, transparent 62%),
        radial-gradient(ellipse 60% 45% at 78% 40%, var(--tint-b) 0%, transparent 60%);
      transition: background 900ms var(--ease);
      animation: drift 34s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from {
        transform: translate3d(-2%, 1%, 0) scale(1.04);
      }

      to {
        transform: translate3d(3%, -2%, 0) scale(1.1);
      }
    }

    .edge {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 24%, rgba(0, 0, 0, 0.55) 72%, rgba(0, 0, 0, 0.92) 100%);
      animation: breathe 11s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.86;
      }

      50% {
        opacity: 1;
      }
    }

    .edge::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: var(--grain);
      mix-blend-mode: overlay;
      transition: opacity 900ms var(--ease);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/></filter><rect width="180" height="180" filter="url(%23n)"/></svg>');
    }

    /* ============================================================
       9 · FRAGMENTOS
       ============================================================ */
    .markers {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .marker {
      position: absolute;
      width: 128px;
      height: 128px;
      margin: -64px 0 0 -64px;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
    }

    .marker.on {
      pointer-events: auto;
    }

    /* Escritos a cada quadro pelo laco; sem transicao, para que o movimento
       venha da rolagem e nao de uma animacao concorrente. */
    .marker .glyph {
      position: relative;
      width: 9px;
      height: 9px;
      background: var(--accent);
      transform: rotate(45deg) scale(calc(0.35 + var(--f, 0) * 0.9));
      box-shadow: 0 0 calc(16px * var(--f, 0)) calc(3px * var(--f, 0)) var(--accent);
      transition: background 900ms var(--ease);
    }

    .marker .glyph::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 96px;
      margin: -48px 0 0 -0.5px;
      transform: rotate(-45deg);
      background: linear-gradient(180deg, transparent, var(--accent), transparent);
      opacity: calc(var(--f, 0) * 0.5);
    }

    .marker .tag {
      position: absolute;
      top: calc(50% + 26px);
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--ink);
      opacity: calc(var(--f, 0) * var(--f, 0));
      transition: color 260ms var(--ease);
    }

    .marker.seen .glyph {
      background: var(--ink-faint);
      box-shadow: none;
    }

    .marker.seen .tag {
      color: var(--ink-dim);
    }

    /* Com o ponteiro em cima a forma migra para a mira e o nome deixa de
       depender da proximidade do centro. */
    .marker.pego .glyph {
      opacity: 0;
      transition: opacity 240ms var(--ease);
    }

    .marker.pego .tag {
      opacity: 1;
      color: var(--ink);
      transition: opacity 240ms var(--ease), color 240ms var(--ease);
    }

    /* ============================================================
       10 · CABECALHO
       ============================================================ */
    /* Altura rolavel; a cena nao rola junto, ela e traduzida pelo progresso. */
    .track {
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 26px 34px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-faint);
      pointer-events: none;
    }

    .top .title {
      color: var(--ink-dim);
    }

    .top .right {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      transition: border-color 300ms var(--ease), color 300ms var(--ease);
    }

    .switch:hover {
      border-color: var(--line-strong);
      color: var(--ink);
    }

    .switch .bulb {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 9px var(--accent);
      transition: background 900ms var(--ease), box-shadow 900ms var(--ease);
    }

    .switch .wave {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 9px;
    }

    .switch .wave i {
      width: 2px;
      height: 3px;
      background: var(--ink-faint);
      transition: background 300ms var(--ease);
    }

    #sound[aria-pressed="true"] .wave i {
      background: var(--accent);
      animation: pulse 1.1s ease-in-out infinite;
    }

    #sound[aria-pressed="true"] .wave i:nth-child(2) {
      animation-delay: 0.22s;
    }

    #sound[aria-pressed="true"] .wave i:nth-child(3) {
      animation-delay: 0.44s;
    }

    @keyframes pulse {

      0%,
      100% {
        height: 3px;
      }

      50% {
        height: 9px;
      }
    }

    /* ============================================================
       11 · TRILHO DE PROGRESSO
       ============================================================ */
    .rail {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 20;
      width: min(520px, 62vw);
      height: 26px;
      pointer-events: none;
    }

    .rail .bar {
      position: absolute;
      top: 13px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--line);
    }

    .rail .fill {
      position: absolute;
      top: 13px;
      left: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent));
      transition: background 900ms var(--ease);
    }

    .rail .pip {
      position: absolute;
      top: 10px;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      border: 1px solid var(--ink-faint);
      transform: rotate(45deg);
      background: var(--bg);
      transition: background 400ms var(--ease), border-color 400ms var(--ease);
    }

    .rail .pip.seen {
      background: var(--ink-faint);
      border-color: var(--ink-faint);
    }

    .rail .pip.near {
      border-color: var(--accent);
      background: var(--accent);
    }

    .rail .hint {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-faint);
      transition: opacity 700ms var(--ease);
    }

    /* ============================================================
       12 · ANDAMENTO DO SOM
       ============================================================ */
    .scrub {
      position: fixed;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 15;
      width: 38px;
      height: 46vh;
      opacity: 0.4;
      transition: opacity 500ms var(--ease);
      touch-action: none;
      cursor: grab;
    }

    .scrub:hover,
    .scrub.puxando {
      opacity: 1;
    }

    .scrub.puxando {
      cursor: grabbing;
    }

    .scrub svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .scrub .resto {
      stroke: var(--ink-faint);
      stroke-width: 1.4;
      opacity: 0.5;
    }

    .scrub .feito {
      stroke: var(--accent);
      stroke-width: 1.6;
      transition: stroke 900ms var(--ease);
      filter: drop-shadow(0 0 4px var(--accent));
    }

    .scrub .pega {
      fill: var(--accent);
      opacity: 0;
      transition: opacity 320ms var(--ease), fill 900ms var(--ease);
      filter: drop-shadow(0 0 6px var(--accent));
    }

    .scrub:hover .pega,
    .scrub.puxando .pega {
      opacity: 1;
    }

    /* ============================================================
       13 · LEGENDA
       ============================================================ */
    /* Faixa vertical fixa: limita a estrofe ao viewport qualquer que seja a
       altura do bloco. */
    .lyric {
      position: fixed;
      z-index: 10;
      top: 13vh;
      bottom: 13vh;
      width: min(30ch, 42vw);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: none;
      font-family: var(--canto);
      font-weight: 300;
      font-style: italic;
      font-size: clamp(22px, 2.6vw, 34px);
      line-height: 1.35;
      letter-spacing: 0.01em;
      color: var(--ink-dim);
      text-shadow: 0 0 30px rgba(4, 5, 10, 0.95), 0 2px 4px rgba(4, 5, 10, 0.85);
      opacity: 0;
      filter: blur(4px);
      transform: translateY(10px);
      transition: opacity 800ms var(--ease), filter 800ms var(--ease), transform 800ms var(--ease);
    }

    .lyric.on {
      opacity: 1;
      filter: none;
      transform: none;
    }

    .lyric.oculta {
      opacity: 0 !important;
      filter: blur(4px) !important;
    }

    .lyric.esq {
      left: 6vw;
      align-items: flex-start;
      text-align: left;
    }

    .lyric.dir {
      right: 6vw;
      align-items: flex-end;
      text-align: right;
    }

    .lyric.acima {
      justify-content: flex-start;
    }

    .lyric.abaixo {
      justify-content: flex-end;
    }

    .lyric.meio {
      justify-content: center;
    }

    .lyric p {
      margin-bottom: 0.2em;
      /* Reparte o verso em linhas parecidas em vez de deixar uma palavra sozinha. */
      text-wrap: balance;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 520ms var(--ease), transform 520ms var(--ease), color 520ms var(--ease);
    }

    .lyric p.viva {
      opacity: 0.92;
      transform: none;
      color: var(--ink);
    }

    .lyric p.passou {
      opacity: 0.34;
      transform: none;
    }

    /* Fora da janela sai do fluxo: sem isso a estrofe cresce alem da faixa. */
    .lyric p.fora {
      display: none;
    }

    .lyric[data-tema="vozes"] {
      width: min(26ch, 38vw);
      font-style: normal;
      font-size: clamp(21px, 2.4vw, 31px);
      line-height: 1.85;
      letter-spacing: 0.09em;
    }

    .lyric[data-tema="vozes"] p {
      margin-bottom: 0;
    }

    /* Largo o bastante para os versos longos nao quebrarem em tres linhas. */
    .lyric[data-tema="carta"] {
      width: min(34ch, 46vw);
      font-size: clamp(21px, 2.4vw, 31px);
      line-height: 1.28;
    }

    .lyric[data-tema="carta"] p:first-child {
      color: var(--accent);
      transition: color 900ms var(--ease);
    }

    /* ============================================================
       14 · LEITOR
       ============================================================ */
    .reader {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 7vh 24px;
      background: rgba(4, 5, 10, 0.82);
      backdrop-filter: blur(14px) saturate(0.7);
      -webkit-backdrop-filter: blur(14px) saturate(0.7);
      opacity: 0;
      visibility: hidden;
      transition: opacity 520ms var(--ease), visibility 520ms;
    }

    .reader.open {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      position: relative;
      width: min(640px, 100%);
      max-height: 86vh;
      overflow-y: auto;
      padding: 8px 4px 40px;
      overscroll-behavior: contain;
      transform: translateY(18px);
      transition: transform 620ms var(--ease);
      scrollbar-width: thin;
      scrollbar-color: var(--ink-faint) transparent;
    }

    .reader.open .sheet {
      transform: none;
    }

    .sheet::-webkit-scrollbar {
      width: 3px;
    }

    .sheet::-webkit-scrollbar-thumb {
      background: var(--ink-faint);
    }

    .sheet .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .sheet .meta .kind {
      color: var(--accent);
      transition: color 900ms var(--ease);
    }

    .sheet .meta .draft {
      padding: 2px 7px;
      border: 1px dashed var(--line-strong);
      color: var(--ink-faint);
      letter-spacing: 0.18em;
    }

    .sheet h2 {
      margin-bottom: 30px;
      font-weight: 500;
      font-size: clamp(30px, 5.4vw, 46px);
      line-height: 1.12;
      letter-spacing: -0.015em;
    }

    .sheet p {
      margin-bottom: 22px;
      font-size: clamp(17px, 2.1vw, 19px);
      line-height: 1.78;
      color: var(--ink);
      opacity: 0;
      transform: translateY(8px);
      animation: rise 900ms var(--ease) forwards;
      animation-delay: calc(220ms + var(--i) * 340ms);
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: none;
      }
    }

    .sheet .link {
      position: relative;
      padding: 0 1px;
      color: var(--ink);
      border-bottom: 1px solid var(--accent);
      transition: color 260ms var(--ease), background 260ms var(--ease);
    }

    .sheet .link:hover {
      background: var(--accent);
      color: #06070c;
    }

    .sheet .again {
      margin-top: 34px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .close {
      position: fixed;
      top: 24px;
      right: 30px;
      z-index: 41;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: var(--ink-faint);
      font-size: 20px;
      line-height: 1;
      opacity: 0;
      visibility: hidden;
      transition: opacity 420ms var(--ease), visibility 420ms, color 260ms var(--ease);
    }

    .reader.open~.close {
      opacity: 1;
      visibility: visible;
    }

    .close:hover {
      color: var(--ink);
    }

    /* ============================================================
       15 · ABERTURA E AVISOS
       ============================================================ */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: var(--bg);
      transition: opacity 1400ms var(--ease), visibility 1400ms;
    }

    .veil.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .veil span {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--ink-faint);
      animation: fade 3.2s ease-in-out infinite;
    }

    @keyframes fade {

      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 0.8;
      }
    }

    .notice {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      background: var(--bg);
      color: var(--ink-dim);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 2;
      letter-spacing: 0.1em;
    }

    .notice code {
      color: var(--accent);
    }

    /* ============================================================
       16 · TELAS ESTREITAS E MENOS MOVIMENTO
       ============================================================ */
    @media (max-width: 760px) {
      .top {
        padding: 18px 18px;
        font-size: 9px;
      }

      .rail {
        width: 62vw;
        bottom: 22px;
      }

      .rail .hint {
        display: none;
      }

      .close {
        top: 14px;
        right: 14px;
      }

      .marker {
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
      }

      .scrub {
        display: none;
      }

      .lyric,
      .lyric[data-tema="vozes"],
      .lyric[data-tema="carta"] {
        width: 74vw;
        font-size: 21px;
      }
    }

    /* Sem ponteiro nao ha lanterna: o comodo fica apenas rebaixado. */
    @media (hover: none) {
      body {
        cursor: auto;
      }

      .lume,
      .ponta,
      .scrub {
        display: none;
      }

      .veu {
        background: rgba(4, 5, 10, 0.74);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .haze,
      .edge,
      .scene,
      .veil span {
        animation: none;
      }

      .sheet p {
        animation-delay: 0ms;
        animation-duration: 1ms;
      }
    }
  </style>
</head>

<body>

  <!-- As camadas sao inseridas em .scene pelo script, na ordem de pintura:
       quartos · veu · parede · poeira · lume · frente · marcadores -->
  <div class="stage" aria-hidden="true">
    <div class="scene" id="scene">
      <div class="veu" id="veu"></div>
      <canvas class="dust" id="dust"></canvas>
      <div class="lume" id="lume"></div>
      <div class="markers" id="markers"></div>
    </div>
  </div>

  <div class="haze" aria-hidden="true"></div>
  <div class="edge" aria-hidden="true"></div>

  <div class="track" id="track"></div>

  <header class="top">
    <div class="title">Dreamer</div>
    <div class="right">
      <button class="switch" id="sound" type="button" aria-pressed="false" aria-label="Som ambiente" hidden>
        <span class="wave"><i></i><i></i><i></i></span><span>som</span>
      </button>
      <button class="switch" id="switch" type="button" aria-pressed="false">
        <span class="bulb"></span><span>alternar · E</span>
      </button>
    </div>
  </header>

  <div class="scrub" id="scrub" hidden>
    <svg id="scrubSvg" aria-hidden="true">
      <path class="resto" id="scrubResto" fill="none" />
      <path class="feito" id="scrubFeito" fill="none" />
      <circle class="pega" id="scrubPega" r="4" />
    </svg>
  </div>

  <div class="rail" id="rail">
    <div class="bar"></div>
    <div class="fill" id="fill"></div>
    <div class="hint" id="hint">role para percorrer</div>
  </div>

  <div class="lyric" id="lyric" aria-hidden="true"></div>

  <div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <article class="sheet" id="sheet"></article>
  </div>
  <button class="close" id="close" type="button" aria-label="Fechar">&#215;</button>

  <div class="ponta" id="ponta" aria-hidden="true"><i></i></div>

  <div class="veil" id="veil"><span>abrindo</span></div>

  <script>
    (function () {
      "use strict";

      /* ══════════════════════════════════════════════════════════
         1 · CONFIGURACAO
         ══════════════════════════════════════════════════════════ */
      const SOURCE = "./Assets/Dreamer/fragmentos.json";
      const ART = "./Assets/Dreamer/camadas/";
      const STORE = "dreamer.progress";

      // A peca se repete, entao o percurso independe do tamanho do arquivo.
      const CENA = {
        files: ["a-quartos.png", "a-fundo.png", "a-frente.png"],
        depths: [0.6, 0.6, 1],                       // velocidade de cada camada
        ancora: 1,                                   // camada a que os fragmentos pertencem
        poeiraAtras: 2,                              // camada que passa na frente da poeira
        lampada: { camada: 1, x: 0.313, y: 0.209 },  // posicao da luz dentro da peca
        reach: 5,                                    // larguras de tela de percurso
        span: 6                                      // alturas de tela de rolagem
      };

      // Faixas tocadas em sequencia, em ciclo. 'letra' e opcional.
      const AUDIO = {
        dir: "./Assets/Dreamer/audio/",
        volume: 0.7,                                 // teto de volume, 0 a 1
        fade: 1600,                                  // entrada do som, em ms
        recuo: 0.35,                                 // fracao do volume enquanto se le
        faixas: [
          {
            arquivo: "Letter - From the Lost Days.mp3",
            letra: "Letter - From the Lost Days.json"
          },
          {
            arquivo: "Rain of Brass Petals - Three Vocals Edit.mp3",
            letra: "Rain of Brass Petals - Three Vocals Edit.json"
          }
        ]
      };

      // Lado da tela e apoio dentro da faixa vertical, percorridos em ordem.
      const CANTOS = [
        "esq acima", "dir abaixo", "dir acima",
        "esq abaixo", "esq meio", "dir meio"
      ];

      const RESPIRO = 3;        // segundos de silencio que separam duas estrofes
      const ATRAS = 3;          // versos de eco mantidos atras do atual
      const ADIANTE = 1;        // verso adiante ja no fluxo, para a transicao ter de onde partir
      const INERCIA = 0.12;     // fracao da distancia vencida por quadro a 60fps
      const PESO_LUZ = 0.16;    // idem, para o halo do ponteiro

      /* ══════════════════════════════════════════════════════════
         2 · ELEMENTOS
         ══════════════════════════════════════════════════════════ */
      const el = {
        scene: document.getElementById("scene"),
        veu: document.getElementById("veu"),
        dust: document.getElementById("dust"),
        lume: document.getElementById("lume"),
        ponta: document.getElementById("ponta"),
        markers: document.getElementById("markers"),
        track: document.getElementById("track"),
        rail: document.getElementById("rail"),
        fill: document.getElementById("fill"),
        hint: document.getElementById("hint"),
        scrub: document.getElementById("scrub"),
        lyric: document.getElementById("lyric"),
        reader: document.getElementById("reader"),
        sheet: document.getElementById("sheet"),
        close: document.getElementById("close"),
        veil: document.getElementById("veil"),
        toggle: document.getElementById("switch"),
        som: document.getElementById("sound")
      };

      /* ══════════════════════════════════════════════════════════
         3 · ESTADO
         ══════════════════════════════════════════════════════════ */
      const app = {
        phase: 0,
        som: true,              // vale so nesta visita: recarregar volta a ligar
        items: [],
        byId: new Map(),
        read: new Set(),
        layers: [],
        nodes: new Map(),       // id -> { marker, pip }
        box: { w: 0, h: 0, travel: 1 },
        p: 0,                   // progresso amortecido
        alvo: 0,                // progresso cru da rolagem
        open: null,
        ready: false
      };

      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const smooth = t => t * t * (3 - 2 * t);
      // Amortecimento independente da taxa de quadros: em 144Hz o passo e menor.
      const passoDe = (fracao, dt) => 1 - Math.pow(1 - fracao, dt * 60);

      /* ══════════════════════════════════════════════════════════
         4 · PERSISTENCIA
         ══════════════════════════════════════════════════════════ */
      function restore() {
        try {
          const raw = localStorage.getItem(STORE);
          if (!raw) return;
          (JSON.parse(raw).read || []).forEach(id => app.read.add(id));
        } catch (e) { /* armazenamento indisponivel: segue sem historico */ }
      }

      function persist() {
        try {
          localStorage.setItem(STORE, JSON.stringify({ read: [...app.read] }));
        } catch (e) { /* idem */ }
      }

      /* ══════════════════════════════════════════════════════════
         5 · DADOS
         ══════════════════════════════════════════════════════════ */
      async function load() {
        const res = await fetch(SOURCE);
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const data = await res.json();
        app.items = (data.fragmentos || []).slice().sort((x, y) => x.at - y.at);
        app.items.forEach(f => app.byId.set(f.id, f));
      }

      // Um fragmento existe se a fase confere e os pre-requisitos ja foram lidos.
      function available(f) {
        if (f.estado != null && f.estado !== app.phase) return false;
        if (f.requer && !f.requer.every(id => app.read.has(id))) return false;
        return true;
      }

      /* ══════════════════════════════════════════════════════════
         6 · POEIRA
         ══════════════════════════════════════════════════════════ */
      const poeira = (function () {
        const ctx = el.dust.getContext("2d");
        let pontos = [], w = 0, h = 0, rodando = false, desloc = 0;

        function nascer(espalhado) {
          return {
            x: Math.random() * w,
            y: espalhado ? Math.random() * h : h + 12,
            r: 0.25 + Math.random() * 0.75,
            v: 3 + Math.random() * 10,
            a: 0.05 + Math.random() * 0.18,
            fase: Math.random() * 6.283,
            amp: 4 + Math.random() * 15
          };
        }

        function dimensionar() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = window.innerWidth;
          h = window.innerHeight;
          el.dust.width = w * dpr;
          el.dust.height = h * dpr;
          el.dust.style.width = w + "px";
          el.dust.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = "#cfc6b0";
          const quantos = w < 760 ? 60 : 156;
          pontos = [];
          for (let i = 0; i < quantos; i++) pontos.push(nascer(true));
        }

        return {
          iniciar() {
            if (rodando) return;
            rodando = true;
            dimensionar();
          },
          redimensionar() { if (rodando) dimensionar(); },
          mover(d) { desloc = d; },
          passo(dt) {
            if (!rodando) return;
            ctx.clearRect(0, 0, w, h);
            for (const p of pontos) {
              p.y -= p.v * dt;
              p.fase += dt * 0.5;
              if (p.y < -12) Object.assign(p, nascer(false));
              // x vive no espaco da parede e da a volta pela tela: assim o grao
              // acompanha o fundo sem precisar nascer e morrer a cada rolagem.
              const x = p.x + Math.sin(p.fase) * p.amp - desloc;
              ctx.globalAlpha = p.a;
              ctx.beginPath();
              ctx.arc(((x % w) + w) % w, p.y, p.r, 0, 6.283);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }
        };
      })();

      /* ══════════════════════════════════════════════════════════
         7 · LANTERNA
         ══════════════════════════════════════════════════════════ */
      const luz = (function () {
        let alvoX = 0, alvoY = 0, x = 0, y = 0, viva = false;

        window.addEventListener("pointermove", e => {
          if (e.pointerType === "touch") return;
          alvoX = e.clientX;
          alvoY = e.clientY;
          // A mira acompanha o ponteiro sem atraso; so o halo tem peso.
          el.ponta.style.transform = "translate3d(" + alvoX + "px," + alvoY + "px,0)";
          if (viva) return;
          viva = true;
          x = alvoX;
          y = alvoY;
          el.lume.classList.add("on");
          el.ponta.classList.add("on");
        }, { passive: true });

        window.addEventListener("pointerleave", () => {
          viva = false;
          el.lume.classList.remove("on");
          el.ponta.classList.remove("on");
          el.veu.style.removeProperty("--lx");
          el.veu.style.removeProperty("--ly");
        });

        return {
          achar(m) {
            el.ponta.classList.add("achou");
            m.classList.add("pego");
          },
          largar(m) {
            el.ponta.classList.remove("achou");
            m.classList.remove("pego");
          },
          passo(dt) {
            if (!viva) return;
            const k = passoDe(PESO_LUZ, dt);
            x += (alvoX - x) * k;
            y += (alvoY - y) * k;
            el.lume.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
            el.veu.style.setProperty("--lx", x.toFixed(0) + "px");
            el.veu.style.setProperty("--ly", y.toFixed(0) + "px");
          }
        };
      })();

      /* ══════════════════════════════════════════════════════════
         8 · ANDAMENTO DO SOM
         ══════════════════════════════════════════════════════════ */
      const trilha = (function () {
        const svg = document.getElementById("scrubSvg");
        const resto = document.getElementById("scrubResto");
        const feito = document.getElementById("scrubFeito");
        const pega = document.getElementById("scrubPega");
        let total = 0, amostras = [], alto = 0, puxando = false;

        // Duas frequencias somadas para o traco nao virar um seno regular.
        function onda(w, h) {
          const meio = w / 2, passos = 96;
          let d = "";
          for (let i = 0; i <= passos; i++) {
            const k = i / passos;
            const x = meio
              + Math.sin(k * Math.PI * 8) * (w * 0.3)
              + Math.sin(k * Math.PI * 21 + 1.1) * (w * 0.11);
            d += (i ? "L" : "M") + x.toFixed(2) + " " + (k * h).toFixed(2);
          }
          return d;
        }

        function montar() {
          const r = el.scrub.getBoundingClientRect();
          if (!r.height) return;
          alto = r.height;
          const d = onda(r.width, r.height);
          svg.setAttribute("viewBox", "0 0 " + r.width + " " + r.height);
          resto.setAttribute("d", d);
          feito.setAttribute("d", d);
          total = feito.getTotalLength();
          feito.style.strokeDasharray = total;
          // O gesto e vertical e o traco nao: tabela converte altura em comprimento.
          amostras = [];
          for (let i = 0; i <= 160; i++) {
            const c = (i / 160) * total;
            amostras.push({ c: c, y: feito.getPointAtLength(c).y });
          }
          pintar();
        }

        function comprimentoEm(p) {
          const y = clamp(p, 0, 1) * alto;
          for (let i = 1; i < amostras.length; i++) {
            if (amostras[i].y >= y) {
              const a = amostras[i - 1], b = amostras[i];
              const f = b.y === a.y ? 0 : (y - a.y) / (b.y - a.y);
              return a.c + (b.c - a.c) * f;
            }
          }
          return total;
        }

        function pintar() {
          if (!total) return;
          const s = som.posicao();
          const c = comprimentoEm(s.total ? s.atual / s.total : 0);
          feito.style.strokeDashoffset = total - c;
          const pt = feito.getPointAtLength(c);
          pega.setAttribute("cx", pt.x);
          pega.setAttribute("cy", pt.y);
        }

        function fracao(e) {
          const r = el.scrub.getBoundingClientRect();
          return clamp((e.clientY - r.top) / r.height, 0, 1);
        }

        function soltar() {
          puxando = false;
          el.scrub.classList.remove("puxando");
        }

        el.scrub.addEventListener("pointerdown", e => {
          puxando = true;
          el.scrub.classList.add("puxando");
          el.scrub.setPointerCapture(e.pointerId);
          som.irPara(fracao(e));
          pintar();
        });
        el.scrub.addEventListener("pointermove", e => {
          if (!puxando) return;
          som.irPara(fracao(e));
          pintar();
        });
        el.scrub.addEventListener("pointerup", soltar);
        el.scrub.addEventListener("pointercancel", soltar);

        return { montar: montar, pintar: pintar };
      })();

      /* ══════════════════════════════════════════════════════════
         9 · SOM E LEGENDA
         ══════════════════════════════════════════════════════════ */
      const som = (function () {
        let faixa = null, indice = 0, timer = 0, relogio = 0;
        let tocando = false, audivel = false;
        // Autoplay de audio no Chrome depende da nota do site, nao do mudo.
        // Antes do gesto o tempo corre aqui e o elemento fica so carregado.
        let preludiando = false, virtual = 0, marca = 0;
        let carregada = "";      // arquivo que ja esta no elemento
        let blocos = [], blocoAtivo = -1, versoAtivo = -1, canto = 0, tema = "";

        /* ── letra ── */
        async function carregarLetra(nome) {
          blocos = []; blocoAtivo = -1; versoAtivo = -1; tema = "";
          apagarLegenda();
          if (!nome) return;
          try {
            const res = await fetch(AUDIO.dir + encodeURIComponent(nome));
            if (!res.ok) return;
            const d = await res.json();
            tema = d.tema || "";
            blocos = agrupar((d.linhas || []).slice().sort((x, y) => x.t - y.t));
          } catch (e) { /* sem letra: a faixa toca do mesmo jeito */ }
        }

        // Versos com menos de RESPIRO segundos entre si formam uma estrofe.
        function agrupar(linhas) {
          const out = [];
          linhas.forEach(l => {
            const b = out[out.length - 1];
            const anterior = b ? b.linhas[b.linhas.length - 1] : null;
            const fecha = anterior ? (anterior.fim != null ? anterior.fim : anterior.t) : -99;
            if (!b || l.t - fecha > RESPIRO) out.push({ linhas: [l] });
            else b.linhas.push(l);
          });
          out.forEach(b => {
            b.t = b.linhas[0].t;
            const u = b.linhas[b.linhas.length - 1];
            b.fim = u.fim != null ? u.fim : u.t + 6;
          });
          return out;
        }

        function abrirBloco(bloco) {
          const c = CANTOS[bloco.linhas[0].canto != null
            ? bloco.linhas[0].canto % CANTOS.length
            : canto++ % CANTOS.length];
          const n = el.lyric;
          n.className = "lyric " + c;
          n.dataset.tema = tema;
          n.textContent = "";
          bloco.linhas.forEach(l => {
            const p = document.createElement("p");
            p.textContent = l.texto;
            n.appendChild(p);
          });
          requestAnimationFrame(() => n.classList.add("on"));
        }

        function apagarLegenda() {
          el.lyric.classList.remove("on");
        }

        // Fonte unica do tempo: relogio proprio no preludio, elemento depois dele.
        function agora() {
          return preludiando ? virtual : (faixa ? faixa.currentTime : 0);
        }

        function duracao() {
          return faixa && isFinite(faixa.duration) ? faixa.duration : 0;
        }

        function acompanhar() {
          if (preludiando) {
            const n = performance.now();
            virtual += (n - marca) / 1000;
            marca = n;
            const d = duracao();
            if (d && virtual >= d) virtual = 0;
          }
          trilha.pintar();
          if (!faixa || !blocos.length) return;
          const t = agora();

          let bi = -1;
          for (let k = 0; k < blocos.length; k++) {
            if (t >= blocos[k].t - 0.3 && t <= blocos[k].fim + 1.2) { bi = k; break; }
          }
          if (bi !== blocoAtivo) {
            blocoAtivo = bi;
            versoAtivo = -1;
            bi >= 0 ? abrirBloco(blocos[bi]) : apagarLegenda();
          }
          if (bi < 0) return;

          const linhas = blocos[bi].linhas;
          let vi = -1;
          for (let k = 0; k < linhas.length; k++) if (linhas[k].t <= t) vi = k; else break;
          if (vi === versoAtivo) return;
          versoAtivo = vi;

          // Janela deslizante limita a altura do bloco.
          const centro = Math.max(vi, 0);
          [...el.lyric.children].forEach((p, k) => {
            p.classList.toggle("viva", k === vi);
            p.classList.toggle("passou", k < vi);
            p.classList.toggle("fora", k < centro - ATRAS || k > centro + ADIANTE);
          });
        }

        /* ── reproducao ── */
        // Carregar nao exige gesto; so tocar exige. O preludio para por aqui.
        // Reatribuir o src reinicia o elemento e descarta qualquer busca de
        // tempo feita em seguida, entao so recarrega quando a faixa muda.
        function preparar() {
          if (!faixa) {
            faixa = new Audio();
            faixa.preload = "auto";
            faixa.addEventListener("ended", proxima);
            faixa.addEventListener("error", falhar);
            faixa.addEventListener("loadedmetadata", () => trilha.montar());
          }
          const atual = AUDIO.faixas[indice];
          if (carregada === atual.arquivo) return;
          carregada = atual.arquivo;
          faixa.volume = 0;
          faixa.src = AUDIO.dir + encodeURIComponent(atual.arquivo);
          carregarLetra(atual.letra);
        }

        // Buscar antes dos metadados nao tem efeito: nesse caso espera por eles.
        function irA(t) {
          if (faixa.readyState >= 1) faixa.currentTime = t;
          else faixa.addEventListener("loadedmetadata",
            () => { faixa.currentTime = t; }, { once: true });
        }

        function tocar(de) {
          preparar();
          faixa.volume = 0;
          if (de) irA(de);
          faixa.play().then(() => esmaecer(AUDIO.volume)).catch(falhar);
        }

        function proxima() {
          indice = (indice + 1) % AUDIO.faixas.length;
          tocar();
        }

        function esmaecer(alvo, ms) {
          clearInterval(timer);
          const dur = ms || AUDIO.fade;
          const inicio = faixa ? faixa.volume : 0;
          const t0 = performance.now();
          timer = setInterval(() => {
            const k = clamp((performance.now() - t0) / dur, 0, 1);
            if (faixa) faixa.volume = clamp(inicio + (alvo - inicio) * k, 0, 1);
            if (k >= 1) clearInterval(timer);
          }, 40);
        }

        function acompanharDeNovo() {
          clearInterval(relogio);
          relogio = setInterval(acompanhar, 200);
        }

        function ligar(de) {
          if (tocando || !AUDIO.faixas.length) return;
          preludiando = false;
          tocando = true;
          audivel = true;
          el.som.setAttribute("aria-pressed", "true");
          tocar(de);
          el.scrub.hidden = false;
          trilha.montar();
          acompanharDeNovo();
        }

        // O gesto entrega o som no ponto em que o relogio chegou, nao do zero.
        function revelar() {
          if (!preludiando) return;
          const de = virtual;
          preludiando = false;
          ligar(de);
          app.som = true;
        }

        // Pausa: para na hora e deixa legenda e fio onde estao.
        function pausar() {
          if (!tocando) return;
          tocando = false;
          audivel = false;
          el.som.setAttribute("aria-pressed", "false");
          clearInterval(timer);
          clearInterval(relogio);
          if (faixa) faixa.pause();
        }

        function seguir() {
          if (tocando || !faixa || !faixa.src) return;
          tocando = true;
          audivel = true;
          el.som.setAttribute("aria-pressed", "true");
          faixa.volume = 0;
          faixa.play().then(() => esmaecer(AUDIO.volume)).catch(falhar);
          acompanharDeNovo();
        }

        // Falha de carregamento tira tudo de cena; pausa do visitante nao.
        function falhar() {
          tocando = false;
          preludiando = false;
          audivel = false;
          el.som.setAttribute("aria-pressed", "false");
          clearInterval(timer);
          clearInterval(relogio);
          el.scrub.hidden = true;
          apagarLegenda();
          if (faixa) faixa.pause();
        }

        return {
          disponivel: () => AUDIO.faixas.length > 0,

          // Legenda e fio correm antes de qualquer gesto, sem tocar o audio.
          preludio() {
            if (!app.som || tocando || preludiando) return;
            preludiando = true;
            marca = performance.now();
            preparar();
            el.som.setAttribute("aria-pressed", "false");
            el.scrub.hidden = false;
            trilha.montar();
            acompanharDeNovo();
          },

          retomar() {
            if (preludiando) { revelar(); return; }
            if (tocando) return;
            if (app.som) ligar();
          },

          alternar() {
            if (preludiando) { revelar(); return; }   // primeiro toque entrega o som
            if (tocando) { pausar(); app.som = false; return; }
            faixa && faixa.src ? seguir() : ligar();
            app.som = true;
          },

          // Enquanto o leitor esta aberto a legenda sai e a faixa recua.
          recolher(v) {
            el.lyric.classList.toggle("oculta", v);
            if (audivel) esmaecer(v ? AUDIO.volume * AUDIO.recuo : AUDIO.volume, 500);
          },

          posicao: () => ({ atual: agora(), total: duracao() }),

          irPara(p) {
            const d = duracao();
            if (!d) return;
            const t = clamp(p, 0, 1) * d;
            if (preludiando) { virtual = t; marca = performance.now(); }
            else irA(t);
            blocoAtivo = -1;              // forca a legenda a reencontrar o trecho
            versoAtivo = -1;
            acompanhar();
          }
        };
      })();

      /* ══════════════════════════════════════════════════════════
         10 · MONTAGEM DA CENA
         ══════════════════════════════════════════════════════════ */
      function buildScene() {
        CENA.files.forEach((file, i) => {
          const l = { node: layerNode(file), depth: CENA.depths[i], aspect: 0, step: 0 };
          app.layers.push(l);
          el.scene.insertBefore(l.node, el.markers);
          // A peca so pode ser dimensionada depois que a proporcao real e conhecida.
          probe(ART + file, r => { l.aspect = r; measure(); });
        });

        // A poeira e o halo sao volume do ambiente: ficam atras do primeiro
        // plano para que o entulho os encubra. O veu cobre so os quartos.
        const frente = app.layers[CENA.poeiraAtras];
        if (frente) {
          el.scene.insertBefore(el.dust, frente.node);
          el.scene.insertBefore(el.lume, frente.node);
        }
        const parede = app.layers[CENA.ancora];
        if (parede) el.scene.insertBefore(el.veu, parede.node);

        el.track.style.height = (CENA.span * 100) + "vh";
      }

      function layerNode(file) {
        const d = document.createElement("div");
        d.className = "layer";
        d.style.backgroundImage = "url('" + ART + file + "')";
        return d;
      }

      function probe(url, done) {
        const im = new Image();
        im.onload = () => { if (im.naturalHeight) done(im.naturalWidth / im.naturalHeight); };
        im.src = url;
      }

      function buildMarkers() {
        app.items.forEach(f => {
          const m = document.createElement("button");
          m.type = "button";
          m.className = "marker";
          m.dataset.id = f.id;
          m.setAttribute("aria-label", f.titulo);
          m.innerHTML = '<span class="glyph"></span><span class="tag"></span>';
          m.addEventListener("click", () => show(f.id));
          m.addEventListener("pointerenter", () => luz.achar(m));
          m.addEventListener("pointerleave", () => luz.largar(m));
          el.markers.appendChild(m);

          const pip = document.createElement("i");
          pip.className = "pip";
          pip.style.left = (f.at * 100) + "%";
          el.rail.appendChild(pip);

          app.nodes.set(f.id, { marker: m, pip: pip });
        });
        refreshSeen();
      }

      function refreshSeen() {
        app.nodes.forEach((n, id) => {
          const f = app.byId.get(id);
          const seen = app.read.has(id);
          n.marker.classList.toggle("seen", seen);
          n.pip.classList.toggle("seen", seen);
          n.marker.querySelector(".tag").textContent = seen ? f.titulo : f.tipo;
        });
      }

      /* ══════════════════════════════════════════════════════════
         11 · MEDIDAS
         ══════════════════════════════════════════════════════════ */
      function measure() {
        const w = window.innerWidth, h = window.innerHeight;
        app.box.w = w;
        app.box.h = h;
        app.box.travel = w * CENA.reach;

        app.layers.forEach(l => {
          // A peca e alta como a tela; a largura vem da proporcao real do arquivo.
          l.step = l.aspect ? h * l.aspect : w;
          l.node.style.backgroundSize = "auto " + h + "px";
          l.node.style.width = (w + l.step) + "px";
          l.node.style.height = h + "px";
        });

        acenderLampadas();
      }

      function acenderLampadas() {
        const cfg = CENA.lampada;
        const l = cfg && app.layers[cfg.camada];
        if (!l || !l.step) return;

        const quantas = Math.ceil((app.box.w + l.step) / l.step) + 1;
        while (l.node.children.length > quantas) l.node.lastChild.remove();
        while (l.node.children.length < quantas) {
          const g = document.createElement("i");
          g.className = "lampada";
          l.node.appendChild(g);
        }

        const raio = app.box.h * 0.46;
        [...l.node.children].forEach((g, k) => {
          g.style.width = g.style.height = (raio * 2) + "px";
          g.style.left = (cfg.x * l.step + k * l.step - raio) + "px";
          g.style.top = (cfg.y * app.box.h - raio) + "px";
          g.style.animationDelay = (-k * 2.3) + "s";
        });
      }

      /* ══════════════════════════════════════════════════════════
         12 · PROJECAO
         ══════════════════════════════════════════════════════════ */
      function project(p) {
        const b = app.box;
        const shift = p * b.travel;

        app.layers.forEach(l => {
          // Desliza no maximo uma peca e reinicia; a repeticao esconde o salto.
          const d = l.step ? -((shift * l.depth) % l.step) : 0;
          l.node.style.transform = "translate3d(" + d + "px,0,0)";
        });

        // Os fragmentos acompanham a camada em que estao apoiados, senao deslizam
        // contra a parede em vez de pertencer a ela.
        const dm = CENA.depths[CENA.ancora];
        const alcance = b.travel * dm;
        poeira.mover(shift * dm);
        el.markers.style.transform = "translate3d(" + (-shift * dm) + "px,0,0)";

        app.items.forEach(f => {
          // Ancora que deixa o objeto centrado exatamente quando p == at.
          const x = f.at * alcance + b.w / 2;
          place(app.nodes.get(f.id), f, x, f.alt * b.h, focusFrom((f.at - p) * alcance, b.w));
        });
      }

      // Quanto o objeto esta perto do ponto de leitura: 0 = fora, 1 = no ponto.
      function focusFrom(offset, size) {
        return smooth(clamp(1 - Math.abs(offset) / (size * 0.3), 0, 1));
      }

      function place(n, f, x, y, focus) {
        if (!n) return;
        const live = available(f);
        const on = live && focus > 0.12;
        n.marker.style.transform = "translate3d(" + x + "px," + y + "px,0)";
        n.marker.style.opacity = live ? focus : 0;
        n.marker.style.setProperty("--f", focus.toFixed(3));
        n.marker.classList.toggle("on", on);
        n.pip.classList.toggle("near", on);
        n.pip.style.opacity = live ? 1 : 0.25;
      }

      /* ══════════════════════════════════════════════════════════
         13 · LACO
         ══════════════════════════════════════════════════════════ */
      let ultimo = 0;

      function tick(t) {
        requestAnimationFrame(tick);
        if (!app.ready) return;

        const dt = ultimo ? Math.min((t - ultimo) / 1000, 0.1) : 1 / 60;
        ultimo = t;

        const max = document.documentElement.scrollHeight - window.innerHeight;
        app.alvo = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;

        // O progresso persegue a rolagem em vez de colar nela: a cena ganha peso.
        app.p += (app.alvo - app.p) * passoDe(INERCIA, dt);
        if (Math.abs(app.alvo - app.p) < 0.00002) app.p = app.alvo;

        project(app.p);
        luz.passo(dt);
        poeira.passo(dt);

        el.fill.style.width = (app.p * 100) + "%";
        el.hint.style.opacity = app.alvo > 0.02 ? 0 : 1;
      }

      /* ══════════════════════════════════════════════════════════
         14 · LEITOR
         ══════════════════════════════════════════════════════════ */
      // [[id|palavra]] vira um link para outro fragmento.
      function withLinks(line) {
        const out = document.createDocumentFragment();
        const re = /\[\[([^\|\]]+)\|([^\]]+)\]\]/g;
        let last = 0, m;
        while ((m = re.exec(line))) {
          if (m.index > last) out.append(line.slice(last, m.index));
          const id = m[1], label = m[2];   // fixados por iteracao: o handler roda depois
          const target = app.byId.get(id);
          if (target && available(target)) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "link";
            b.textContent = label;
            b.addEventListener("click", () => travel(id));
            out.append(b);
          } else {
            out.append(label);             // destino indisponivel: fica texto comum
          }
          last = re.lastIndex;
        }
        if (last < line.length) out.append(line.slice(last));
        return out;
      }

      function show(id) {
        const f = app.byId.get(id);
        if (!f || !available(f)) return;

        const again = app.read.has(id) && f.revisita && f.revisita.length;
        const lines = again ? f.revisita : f.texto;

        el.sheet.textContent = "";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = '<span class="kind"></span><span class="when"></span>';
        meta.querySelector(".kind").textContent = f.tipo || "fragmento";
        meta.querySelector(".when").textContent = f.data || "";
        if (f.rascunho) {
          const d = document.createElement("span");
          d.className = "draft";
          d.textContent = "rascunho";
          meta.appendChild(d);
        }
        el.sheet.appendChild(meta);

        const h = document.createElement("h2");
        h.id = "sheetTitle";
        h.textContent = f.titulo;
        el.sheet.appendChild(h);

        lines.forEach((line, i) => {
          const p = document.createElement("p");
          p.style.setProperty("--i", i);
          p.appendChild(withLinks(line));
          el.sheet.appendChild(p);
        });

        if (again) {
          const note = document.createElement("div");
          note.className = "again";
          note.textContent = "segunda leitura";
          el.sheet.appendChild(note);
        }

        el.sheet.scrollTop = 0;
        el.reader.classList.add("open");
        app.open = id;
        som.recolher(true);
        document.documentElement.classList.add("held");
        el.close.focus();

        if (!app.read.has(id)) {
          app.read.add(id);
          persist();
          refreshSeen();
        }
      }

      function hide() {
        el.reader.classList.remove("open");
        app.open = null;
        som.recolher(false);
        document.documentElement.classList.remove("held");
      }

      // Seguir um link percorre a cena ate o destino antes de abrir o fragmento.
      function travel(id) {
        const f = app.byId.get(id);
        if (!f) return;
        hide();
        const max = document.documentElement.scrollHeight - window.innerHeight;
        // O leitor trava a rolagem, entao so pode abrir quando o percurso terminar.
        glide(clamp(f.at, 0, 1) * max, () => show(id));
      }

      // Deslocamento proprio: o fim e conhecido, sem depender de evento do navegador.
      function glide(to, done) {
        const from = window.scrollY;
        const dist = to - from;
        if (Math.abs(dist) < 4) { done(); return; }
        const span = clamp(420 + Math.abs(dist) * 0.4, 420, 1600);
        const t0 = performance.now();
        (function step(now) {
          const k = clamp((now - t0) / span, 0, 1);
          const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
          window.scrollTo(0, from + dist * e);
          if (k < 1) requestAnimationFrame(step); else done();
        })(t0);
      }

      /* ══════════════════════════════════════════════════════════
         15 · FASE
         ══════════════════════════════════════════════════════════ */
      function setPhase(n) {
        app.phase = n;
        document.documentElement.dataset.phase = n;
        el.toggle.setAttribute("aria-pressed", n === 1 ? "true" : "false");
        // A cena mudou por baixo do leitor: fecha em vez de deixar o texto defasado.
        if (app.open) hide();
      }

      /* ══════════════════════════════════════════════════════════
         16 · INICIO
         ══════════════════════════════════════════════════════════ */
      function bind() {
        window.addEventListener("resize", () => {
          measure();
          poeira.redimensionar();
          if (!el.scrub.hidden) trilha.montar();
        });

        el.close.addEventListener("click", hide);
        el.reader.addEventListener("click", e => { if (e.target === el.reader) hide(); });
        el.toggle.addEventListener("click", () => setPhase(app.phase === 0 ? 1 : 0));
        el.som.addEventListener("click", () => som.alternar());

        // Autoplay so e liberado apos um gesto, e rolagem nao conta como um.
        // Sem 'once' porque a primeira tentativa pode ser recusada. O botao de
        // som fica de fora: senao o gesto abriria o volume e o clique o cortaria.
        ["pointerdown", "keydown", "touchstart"].forEach(ev =>
          window.addEventListener(ev, e => {
            if (e.target && el.som.contains(e.target)) return;
            som.retomar();
          }, { passive: true }));

        document.addEventListener("keydown", e => {
          if (e.key === "Escape" && app.open) hide();
          if ((e.key === "e" || e.key === "E") && !e.metaKey && !e.ctrlKey && !e.altKey) {
            setPhase(app.phase === 0 ? 1 : 0);
          }
        });
      }

      function fail(err) {
        const n = document.createElement("div");
        n.className = "notice";
        n.innerHTML =
          "<div>nao foi possivel ler os fragmentos<br><br>" +
          "abra a pagina por um servidor, nao por duplo clique<br>" +
          "<code>npx serve .</code><br><br>" +
          "<span style='opacity:.5'>" + String(err && err.message || err) + "</span></div>";
        document.body.appendChild(n);
      }

      (async function start() {
        restore();

        try {
          await load();
        } catch (err) {
          el.veil.classList.add("gone");
          fail(err);
          return;
        }

        buildScene();
        buildMarkers();
        measure();
        bind();

        // A poeira e a unica peca que roda sozinha o tempo todo; fica de fora
        // de quem pediu menos movimento.
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) poeira.iniciar();
        if (som.disponivel()) { el.som.hidden = false; som.preludio(); }

        app.ready = true;
        tick();
        requestAnimationFrame(() => el.veil.classList.add("gone"));
      })();

    })();
  </script>
</body>

</html>
