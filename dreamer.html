  </div>

  <div class="lyric" id="lyric" aria-hidden="true"></div>

  <div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <article class="sheet" id="sheet"></article>
  </div>
  <button class="close" id="close" type="button" aria-label="Fechar">&#215;</button>

  <div class="ponta" id="ponta" aria-hidden="true"><i></i></div>

  <div class="veil" id="veil"><span>abrindo</span></div>

  <script>
    (function () {
      "use strict";

      /* ══════════════════════════════════════════════════════════
         1 · CONFIGURACAO
         ══════════════════════════════════════════════════════════ */
      const SOURCE = "./Assets/Dreamer/fragmentos.json";
      const ART = "./Assets/Dreamer/camadas/";
      const STORE = "dreamer.progress";

      // A peca se repete, entao o percurso independe do tamanho do arquivo.
      const CENA = {
        files: ["a-quartos.png", "a-fundo.png", "a-frente.png"],
        depths: [0.6, 0.6, 1],                       // velocidade de cada camada
        ancora: 1,                                   // camada a que os fragmentos pertencem
        poeiraAtras: 2,                              // camada que passa na frente da poeira
        lampada: { camada: 1, x: 0.313, y: 0.209 },  // posicao da luz dentro da peca
        // Trechos da peca sem porta, batente ou recorte, medidos na propria arte.
        // O segundo passa de 1 porque atravessa a emenda da peca.
        reboco: {
          zonas: [{ de: 0.394, ate: 0.619 }, { de: 0.953, ate: 1.046 }],
          alto: 0.46
        },
        reach: 5,                                    // larguras de tela de percurso, no ponteiro
        voltas: 1.6,                                 // voltas da peca de percurso, no toque
        span: 6                                      // alturas de tela de rolagem
      };

      // Faixas tocadas em sequencia, em ciclo. 'letra', 'traducao' e 'inicio'
      // sao opcionais. 'inicio' pula a introducao instrumental sem tocar no
      // arquivo: os tempos da letra continuam absolutos.
      const AUDIO = {
        dir: "./Assets/Dreamer/audio/",
        volume: 0.5,                                 // teto de volume, 0 a 1
        fade: 1600,                                  // entrada do som, em ms
        recuo: 0.6,                                  // fracao do volume enquanto se le
        faixas: [
          {
            arquivo: "Letter - From the Lost Days.mp3",
            letra: "Letter - From the Lost Days.json",
            traducao: "Letter - From the Lost Days.pt.json",
            inicio: 22          // 1o verso aos 29,1s
          },
          {
            arquivo: "Rain of Brass Petals - Three Voices Edit.mp3",
            letra: "Rain of Brass Petals - Three Voices Edit.json",
            inicio: 52          // 1o verso aos 64,1s
          }
        ]
      };

      // Lado da tela e apoio dentro da faixa vertical, percorridos em ordem.
      const CANTOS = [
        "esq acima", "dir abaixo", "dir acima",
        "esq abaixo", "esq meio", "dir meio"
      ];

      const FONTE_RISCO = '"Rock Salt", "Segoe Script", cursive';
      const RESPIRO = 3;        // segundos de silencio que separam duas estrofes
      const ATRAS = 3;          // versos de eco mantidos atras do atual
      const ADIANTE = 1;        // verso adiante ja no fluxo, para a transicao ter de onde partir
      const INERCIA = 0.12;     // fracao da distancia vencida por quadro a 60fps
      const PESO_LUZ = 0.16;    // idem, para o halo do ponteiro

      /* ══════════════════════════════════════════════════════════
         2 · ELEMENTOS
         ══════════════════════════════════════════════════════════ */
      const el = {
        scene: document.getElementById("scene"),
        veu: document.getElementById("veu"),
        dust: document.getElementById("dust"),
        marca: document.getElementById("marca"),
        lume: document.getElementById("lume"),
        ponta: document.getElementById("ponta"),
        markers: document.getElementById("markers"),
        track: document.getElementById("track"),
        rail: document.getElementById("rail"),
        fill: document.getElementById("fill"),
        hint: document.getElementById("hint"),
        scrub: document.getElementById("scrub"),
        lyric: document.getElementById("lyric"),
        reader: document.getElementById("reader"),
        sheet: document.getElementById("sheet"),
        close: document.getElementById("close"),
        veil: document.getElementById("veil"),
        title: document.getElementById("title"),
        novo: document.getElementById("novo"),
        fogo: document.getElementById("fogo"),
        convite: document.getElementById("convite"),

        som: document.getElementById("sound")
      };

      /* ══════════════════════════════════════════════════════════
         3 · ESTADO
         ══════════════════════════════════════════════════════════ */
      const app = {

        som: true,              // vale so nesta visita: recarregar volta a ligar
        items: [],
        byId: new Map(),
        read: new Set(),
        layers: [],
        nodes: new Map(),       // id -> { marker, pip }
        box: { w: 0, h: 0, travel: 1 },
        p: 0,                   // progresso amortecido
        alvo: 0,                // progresso cru da rolagem
        open: null,
        ready: false,
        entrou: false,
        queimando: false,
        traduzido: true       // abre em portugues; o titulo leva ao original
      };

      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const smooth = t => t * t * (3 - 2 * t);
      // Amortecimento independente da taxa de quadros: em 144Hz o passo e menor.
      const passoDe = (fracao, dt) => 1 - Math.pow(1 - fracao, dt * 60);

      /* ══════════════════════════════════════════════════════════
         4 · PERSISTENCIA
         ══════════════════════════════════════════════════════════ */
      function restore() {
        try {
          const raw = localStorage.getItem(STORE);
          if (!raw) return;
          (JSON.parse(raw).read || []).forEach(id => app.read.add(id));
        } catch (e) { /* armazenamento indisponivel: segue sem historico */ }
      }

      function persist() {
        try {
          localStorage.setItem(STORE, JSON.stringify({ read: [...app.read] }));
        } catch (e) { /* idem */ }
      }

      /* ══════════════════════════════════════════════════════════
         5 · DADOS
         ══════════════════════════════════════════════════════════ */
      async function load() {
        const res = await fetch(SOURCE);
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const data = await res.json();
        app.items = (data.fragmentos || []).slice().sort((x, y) => x.at - y.at);
        app.items.forEach(f => app.byId.set(f.id, f));
      }

      // Um fragmento existe quando os pre-requisitos dele ja foram lidos.
      function available(f) {
        return !f.requer || f.requer.every(id => app.read.has(id));
      }

      /* ══════════════════════════════════════════════════════════
         6 · POEIRA
         ══════════════════════════════════════════════════════════ */
      const poeira = (function () {
        const ctx = el.dust.getContext("2d");
        // Fora do facho o grao nao some, so recua para o limite do percebido.
        const FORA = 0.55, GANHO = 3.4;
        let pontos = [], w = 0, h = 0, rodando = false, desloc = 0, relogio = 0;

        // Grao em suspensao segue o ar, nao a gravidade: o vento e comum a todos
        // e cada um so desvia um pouco dele. 'queda' cresce com o raio, entao os
        // maiores assentam antes e os planos se separam.
        function nascer() {
          const r = 0.3125 + Math.random() * 0.9375;
          return {
            x: Math.random() * w,
            y: Math.random() * h,
            r: r,
            dx: (Math.random() - 0.5) * 3.5,
            dy: (Math.random() - 0.5) * 3.5,
            queda: 0.22 + r * 0.6,
            a: 0.05 + Math.random() * 0.18,
            fase: Math.random() * 6.283,
            amp: 2 + Math.random() * 6
          };
        }

        function dimensionar() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = window.innerWidth;
          h = window.innerHeight;
          el.dust.width = w * dpr;
          el.dust.height = h * dpr;
          el.dust.style.width = w + "px";
          el.dust.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = "#cfc6b0";
          const quantos = w < 760 ? 75 : 195;
          pontos = [];
          for (let i = 0; i < quantos; i++) pontos.push(nascer());
        }

        return {
          iniciar() {
            if (rodando) return;
            rodando = true;
            dimensionar();
          },
          redimensionar() { if (rodando) dimensionar(); },
          mover(d) { desloc = d; },
          passo(dt) {
            if (!rodando) return;
            relogio += dt;
            // Tres periodos sem multiplo comum: o vento gira sem repetir um ciclo
            // perceptivel. O termo constante em y e o assentamento do ambiente.
            const ventoX = Math.sin(relogio * 0.042) * 3.6 + Math.sin(relogio * 0.014 + 2) * 2.2;
            const ventoY = Math.sin(relogio * 0.025 + 1) * 4 + 1.1;
            const facho = luz.onde();
            const alcance = Math.max(w, h) * 0.19;   // mesmo raio do halo
            ctx.clearRect(0, 0, w, h);
            for (const p of pontos) {
              p.fase += dt * 0.28;
              p.x += (ventoX + p.dx) * dt;
              p.y += (ventoY + p.dy + p.queda) * dt;
              // Da a volta pelas duas bordas: o vento inverte, entao nascer so
              // embaixo deixaria o topo vazio quando a massa subisse.
              if (p.y < -12) p.y = h + 12;
              else if (p.y > h + 12) p.y = -12;
              // x vive no espaco da parede e da a volta pela tela: assim o grao
              // acompanha o fundo sem precisar nascer e morrer a cada rolagem.
              const x = p.x + Math.sin(p.fase) * p.amp - desloc;
              const px = ((x % w) + w) % w;

              // Um grao so e visivel porque espalha luz: dentro do facho ele
              // existe, fora dele fica no limite do percebido.
              let alfa = p.a * FORA;
              if (facho) {
                const g = 1 - Math.hypot(px - facho.x, p.y - facho.y) / alcance;
                if (g > 0) alfa = p.a * (FORA + g * g * GANHO);
              }

              ctx.globalAlpha = Math.min(1, alfa);
              ctx.beginPath();
              ctx.arc(px, p.y, p.r, 0, 6.283);
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }
        };
      })();

      /* ══════════════════════════════════════════════════════════
         7 · LANTERNA
         ══════════════════════════════════════════════════════════ */
      const luz = (function () {
        let alvoX = 0, alvoY = 0, x = 0, y = 0, viva = false;

        window.addEventListener("pointermove", e => {
          if (e.pointerType === "touch") return;
          alvoX = e.clientX;
          alvoY = e.clientY;
          // A mira acompanha o ponteiro sem atraso; so o halo tem peso.
          el.ponta.style.transform = "translate3d(" + alvoX + "px," + alvoY + "px,0)";
          if (viva) return;
          viva = true;
          x = alvoX;
          y = alvoY;
          el.lume.classList.add("on");
          el.ponta.classList.add("on");
        }, { passive: true });

        // O toque nao tem para onde sair: o facho fica onde o dedo largou.
        // A rolagem por toque cancela os eventos de ponteiro assim que assume o
        // gesto, mas o touchmove continua: e por ele que o facho anda no celular.
        function mirar(t) {
          alvoX = t.clientX;
          alvoY = t.clientY;
          if (viva) return;
          viva = true;
          x = alvoX;
          y = alvoY;
          el.lume.classList.add("on");
        }

        const seguirToque = e => { if (e.touches.length === 1) mirar(e.touches[0]); };
        window.addEventListener("touchstart", seguirToque, { passive: true });
        window.addEventListener("touchmove", seguirToque, { passive: true });

        window.addEventListener("pointerleave", e => {
          if (e.pointerType === "touch") return;
          viva = false;
          el.lume.classList.remove("on");
          el.ponta.classList.remove("on");
          el.veu.style.removeProperty("--lx");
          el.veu.style.removeProperty("--ly");
        });

        return {
          // Posicao amortecida, para quem precisa reagir ao facho. Nula quando
          // nao ha lanterna acesa.
          onde: () => (viva ? { x: x, y: y } : null),

          // Acende no ponto dado sem esperar o proximo movimento: o cursor do
          // sistema ja saiu, entao quem entra com o mouse parado ficaria sem nada.
          acender(px, py) {
            alvoX = px; alvoY = py;
            x = px; y = py;
            viva = true;
            el.lume.classList.add("on");
            el.ponta.classList.add("on");
            el.ponta.style.transform = "translate3d(" + px + "px," + py + "px,0)";
            el.lume.style.transform = "translate3d(" + px + "px," + py + "px,0)";
          },

          achar(m) {
            el.ponta.classList.add("achou");
            m.classList.add("pego");
          },
          largar(m) {
            el.ponta.classList.remove("achou");
            m.classList.remove("pego");
          },
          passo(dt) {
            if (!viva) return;
            const k = passoDe(PESO_LUZ, dt);
            x += (alvoX - x) * k;
            y += (alvoY - y) * k;
            el.lume.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
            el.veu.style.setProperty("--lx", x.toFixed(0) + "px");
            el.veu.style.setProperty("--ly", y.toFixed(0) + "px");
          }
        };
      })();

      // Riscado no reboco, nao escrito na tela: a marca vive em coordenada de
      // parede, anda com ela e so aparece onde a lanterna passa.
      const marca = (function () {
        const ctx = el.marca.getContext("2d");
        let arte = null, ancora = 0, base = 0, alvo = 0, opacidade = 0, dpr = 1;

        function fundo() {
          return CENA.depths[CENA.ancora] || 1;
        }

        function dimensionar() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          el.marca.width = Math.round(window.innerWidth * dpr);
          el.marca.height = Math.round(window.innerHeight * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        // Traco a traco, com desvio por caractere: fonte de escrita desenhada
        // em linha reta ainda parece tipografia, nao mao humana.
        function riscar(c, texto, x, y, corpo) {
          let cx = x;
          for (const ch of texto) {
            const larg = c.measureText(ch).width;
            c.save();
            c.translate(cx + larg / 2, y + (Math.random() - 0.5) * corpo * 0.09);
            c.rotate((Math.random() - 0.5) * 0.05);
            c.fillText(ch, -larg / 2, 0);
            c.restore();
            cx += larg * (0.99 + Math.random() * 0.04);
          }
        }

        // A faixa de reboco e estreita e o verso inteiro nao cabe: quebra no
        // espaco, medindo, em vez de transbordar para cima da porta.
        function quebrar(c, texto, util) {
          const saida = [];
          let linha = "";
          for (const p of texto.split(" ")) {
            const tenta = linha ? linha + " " + p : p;
            if (linha && c.measureText(tenta).width > util) { saida.push(linha); linha = p; }
            else linha = tenta;
          }
          if (linha) saida.push(linha);
          return saida;
        }

        // Largura de referencia: sempre a maior faixa. Medir pela faixa em que a
        // marca calha de cair faria o tamanho dela mudar a cada volta.
        function referencia() {
          const passo = app.layers[CENA.ancora].step || window.innerWidth;
          let maior = 0;
          for (const z of CENA.reboco.zonas) maior = Math.max(maior, (z.ate - z.de) * passo);
          return maior * 0.9;
        }

        // Trecho de reboco mais a vista neste instante, entre os que comportam a
        // marca. Sem nenhum na tela, o mais proximo dela, para ela entrar em
        // quadro conforme se anda.
        function zona(largura) {
          const w = window.innerWidth;
          const passo = app.layers[CENA.ancora].step || w;
          const desloc = app.p * app.box.travel * fundo();
          let melhor = null;
          for (const z of CENA.reboco.zonas) {
            if ((z.ate - z.de) * passo < largura) continue;
            const k0 = Math.floor((desloc - z.ate * passo) / passo);
            for (let k = k0; k <= k0 + 2; k++) {
              const a = (k + z.de) * passo - desloc;
              const b = (k + z.ate) * passo - desloc;
              const va = Math.max(a, 0), vb = Math.min(b, w);
              const nota = vb > va ? vb - va : -Math.min(Math.abs(a - w / 2), Math.abs(b - w / 2));
              if (!melhor || nota > melhor.nota) melhor = { nota: nota, a: a, b: b, va: va, vb: vb };
            }
          }
          melhor.desloc = desloc;
          return melhor;
        }

        // O que se ve nao e tinta, e o sulco: uma sombra dentro e um fio de luz
        // no labio de cima. Fora disso viraria legenda colada na parede.
        function compor(versos, util) {
          const h = window.innerHeight;
          const teto = h * 0.3;
          const molde = document.createElement("canvas").getContext("2d");

          let corpo = Math.round(h * 0.03), linhas = [];
          for (;;) {
            molde.font = corpo + "px " + FONTE_RISCO;
            linhas = [];
            versos.forEach(t => quebrar(molde, t, util).forEach(q => linhas.push(q)));
            const largo = Math.max.apply(null, linhas.map(t => molde.measureText(t).width));
            if (corpo <= 9 || (linhas.length * corpo * 1.9 <= teto && largo <= util)) break;
            corpo -= 1;
          }

          const larguraDe = () => Math.max.apply(null, linhas.map(t => molde.measureText(t).width));
          const alturaLinha = corpo * 1.9;
          const pad = corpo * 0.9;
          const cv = document.createElement("canvas");
          cv.width = Math.ceil((larguraDe() + pad * 2) * dpr);
          cv.height = Math.ceil((alturaLinha * linhas.length + pad * 2) * dpr);
          const c = cv.getContext("2d");
          // Escrita espelhada: o desenho inteiro inverte, entao cada letra vira
          // junto e a primeira acaba a direita. Inverter so a ordem dos
          // caracteres deixava cada letra virada para o lado certo.
          c.setTransform(-dpr, 0, 0, dpr, cv.width, 0);
          c.font = corpo + "px " + FONTE_RISCO;
          c.textBaseline = "middle";

          linhas.forEach((t, i) => {
            const y = pad + alturaLinha * (i + 0.5);
            const x = pad + (Math.random() - 0.5) * corpo * 0.6;
            c.save();
            c.translate(x, y);
            c.rotate((Math.random() - 0.5) * 0.018);
            c.fillStyle = "rgba(6, 6, 8, 0.85)";
            riscar(c, t, 1.5, 1.5, corpo);
            c.fillStyle = "rgba(228, 222, 206, 0.9)";
            riscar(c, t, 0, 0, corpo);
            c.restore();
          });

          // Reboco velho nao segura traco inteiro: pontos comidos ao acaso
          // quebram a linha e tiram o ar de fonte impressa.
          c.globalCompositeOperation = "destination-out";
          const furos = Math.round(cv.width * cv.height / (dpr * dpr) / 260);
          for (let i = 0; i < furos; i++) {
            c.beginPath();
            c.arc(Math.random() * cv.width / dpr, Math.random() * cv.height / dpr,
              0.4 + Math.random() * 1.7, 0, 6.283);
            c.fill();
          }
          c.globalCompositeOperation = "source-over";
          return cv;
        }

        return {
          dimensionar: dimensionar,

          mostrar(bloco) {
            arte = compor(bloco.linhas.map(l => l.texto), referencia());
            // Centrada no pedaco a vista, mas sem encostar nos batentes.
            const meia = arte.width / dpr / 2;
            const z = zona(meia * 2);
            const centro = z.vb > z.va ? (z.va + z.vb) / 2 : (z.a + z.b) / 2;
            ancora = clamp(centro, z.a + meia, z.b - meia) + z.desloc;
            base = window.innerHeight * CENA.reboco.alto;
            alvo = 1;
          },

          esconder() { alvo = 0; },

          passo(dt) {
            if (!arte && opacidade < 0.002) return;
            opacidade += (alvo - opacidade) * passoDe(0.05, dt);
            const w = window.innerWidth, h = window.innerHeight;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            if (opacidade < 0.002) { arte = null; return; }

            const lw = arte.width / dpr, lh = arte.height / dpr;
            const x = ancora - app.p * app.box.travel * fundo() - lw / 2;
            const y = base - lh / 2;
            if (x > w || x + lw < 0) return;

            ctx.globalAlpha = opacidade;
            ctx.drawImage(arte, x, y, lw, lh);
            ctx.globalAlpha = 1;

            // Sem facho nao ha marca: e a luz de raspao que acha o sulco.
            const facho = luz.onde();
            ctx.globalCompositeOperation = "destination-in";
            if (facho) {
              const raio = Math.max(w, h) * 0.17;
              const g = ctx.createRadialGradient(facho.x, facho.y, 0, facho.x, facho.y, raio);
              g.addColorStop(0, "rgba(0,0,0,1)");
              g.addColorStop(0.5, "rgba(0,0,0,0.8)");
              g.addColorStop(1, "rgba(0,0,0,0)");
              ctx.fillStyle = g;
              ctx.fillRect(0, 0, w, h);
            } else {
              ctx.clearRect(0, 0, w, h);
            }
            ctx.globalCompositeOperation = "source-over";
          }
        };
      })();

      /* ══════════════════════════════════════════════════════════
         8 · ANDAMENTO DO SOM
         ══════════════════════════════════════════════════════════ */
      const trilha = (function () {
        const svg = document.getElementById("scrubSvg");
        const resto = document.getElementById("scrubResto");
        const feito = document.getElementById("scrubFeito");
        const pega = document.getElementById("scrubPega");
        let total = 0, amostras = [], alto = 0, puxando = false;

        // Duas frequencias somadas para o traco nao virar um seno regular.
        function onda(w, h) {
          const meio = w / 2, passos = 96;
          let d = "";
          for (let i = 0; i <= passos; i++) {
            const k = i / passos;
            const x = meio
              + Math.sin(k * Math.PI * 8) * (w * 0.3)
              + Math.sin(k * Math.PI * 21 + 1.1) * (w * 0.11);
            d += (i ? "L" : "M") + x.toFixed(2) + " " + (k * h).toFixed(2);
          }
          return d;
        }

        function montar() {
          const r = el.scrub.getBoundingClientRect();
          if (!r.height) return;
          alto = r.height;
          const d = onda(r.width, r.height);
          svg.setAttribute("viewBox", "0 0 " + r.width + " " + r.height);
          resto.setAttribute("d", d);
          feito.setAttribute("d", d);
          total = feito.getTotalLength();
          feito.style.strokeDasharray = total;
          // O gesto e vertical e o traco nao: tabela converte altura em comprimento.
          amostras = [];
          for (let i = 0; i <= 160; i++) {
            const c = (i / 160) * total;
            amostras.push({ c: c, y: feito.getPointAtLength(c).y });
          }
          pintar();
        }

        function comprimentoEm(p) {
          const y = clamp(p, 0, 1) * alto;
          for (let i = 1; i < amostras.length; i++) {
            if (amostras[i].y >= y) {
              const a = amostras[i - 1], b = amostras[i];
              const f = b.y === a.y ? 0 : (y - a.y) / (b.y - a.y);
              return a.c + (b.c - a.c) * f;
            }
          }
          return total;
        }

        function pintar() {
          if (!total) return;
          const s = som.posicao();
          const c = comprimentoEm(s.total ? s.atual / s.total : 0);
          feito.style.strokeDashoffset = total - c;
          const pt = feito.getPointAtLength(c);
          pega.setAttribute("cx", pt.x);
          pega.setAttribute("cy", pt.y);
        }

        function fracao(e) {
          const r = el.scrub.getBoundingClientRect();
          return clamp((e.clientY - r.top) / r.height, 0, 1);
        }

        function soltar() {
          puxando = false;
          el.scrub.classList.remove("puxando");
        }

        el.scrub.addEventListener("pointerdown", e => {
          // Sem isso qualquer encosto na faixa ao rolar a pagina viraria um salto.
          if (e.pointerType === "touch" && e.target !== pega) return;
          puxando = true;
          el.scrub.classList.add("puxando");
          el.scrub.setPointerCapture(e.pointerId);
          som.irPara(fracao(e));
          pintar();
        });
        el.scrub.addEventListener("pointermove", e => {
          if (!puxando) return;
          som.irPara(fracao(e));
          pintar();
        });
        el.scrub.addEventListener("pointerup", soltar);
        el.scrub.addEventListener("pointercancel", soltar);

        return { montar: montar, pintar: pintar };
      })();

      /* ══════════════════════════════════════════════════════════
         9 · SOM E LEGENDA
         ══════════════════════════════════════════════════════════ */
      const som = (function () {
        let faixa = null, indice = 0, timer = 0, relogio = 0;
        let tocando = false, audivel = false;
        let carregada = "";      // arquivo que ja esta no elemento
        let blocos = [], blocoAtivo = -1, versoAtivo = -1, canto = 0, tema = "";
        // Canto ja sorteado de cada estrofe. Sobrevive a troca de idioma, que
        // recarrega a letra e reabriria a estrofe no proximo canto da fila.
        let cantos = [];

        /* ── letra ── */
        async function carregarLetra(nome) {
          blocos = []; blocoAtivo = -1; versoAtivo = -1; tema = "";
          apagarLegenda();
          if (!nome) return;
          try {
            const res = await fetch(AUDIO.dir + encodeURIComponent(nome));
            if (!res.ok) return;
            const d = await res.json();
            tema = d.tema || "";
            blocos = agrupar((d.linhas || []).slice().sort((x, y) => x.t - y.t));
          } catch (e) { /* sem letra: a faixa toca do mesmo jeito */ }
        }

        // Versos com menos de RESPIRO segundos entre si formam uma estrofe.
        function agrupar(linhas) {
          const out = [];
          linhas.forEach(l => {
            const b = out[out.length - 1];
            const anterior = b ? b.linhas[b.linhas.length - 1] : null;
            const fecha = anterior ? (anterior.fim != null ? anterior.fim : anterior.t) : -99;
            if (!b || l.t - fecha > RESPIRO) out.push({ linhas: [l] });
            else b.linhas.push(l);
          });
          out.forEach(b => {
            b.t = b.linhas[0].t;
            const u = b.linhas[b.linhas.length - 1];
            b.fim = u.fim != null ? u.fim : u.t + 6;
          });
          return out;
        }

        function abrirBloco(bloco, i) {
          if (cantos[i] == null) {
            const fixo = bloco.linhas[0].canto;
            cantos[i] = fixo != null ? fixo % CANTOS.length : canto++ % CANTOS.length;
          }
          const c = CANTOS[cantos[i]];
          const n = el.lyric;
          n.className = "lyric " + c;
          n.dataset.tema = tema;
          n.textContent = "";
          bloco.linhas.forEach(l => {
            const p = document.createElement("p");
            p.textContent = l.texto;
            n.appendChild(p);
          });
          requestAnimationFrame(() => n.classList.add("on"));
        }

        function apagarLegenda() {
          el.lyric.classList.remove("on");
        }

        function agora() {
          return faixa ? faixa.currentTime : 0;
        }

        function duracao() {
          return faixa && isFinite(faixa.duration) ? faixa.duration : 0;
        }

        // Ponto de partida da faixa atual. O fio e a busca trabalham no trecho
        // que sobra; a legenda continua no tempo real do arquivo.
        function partida() {
          return AUDIO.faixas[indice].inicio || 0;
        }

        function acompanhar() {
          trilha.pintar();
          if (!faixa || !blocos.length) return;
          const t = agora();

          let bi = -1;
          for (let k = 0; k < blocos.length; k++) {
            if (t >= blocos[k].t - 0.3 && t <= blocos[k].fim + 1.2) { bi = k; break; }
          }
          if (bi !== blocoAtivo) {
            blocoAtivo = bi;
            versoAtivo = -1;
            // O trecho ao contrario nao e legenda: ele esta riscado na parede.
            const naParede = bi >= 0 && blocos[bi].linhas.some(l => l.reverso);
            if (naParede) { apagarLegenda(); marca.mostrar(blocos[bi]); }
            else {
              marca.esconder();
              bi >= 0 ? abrirBloco(blocos[bi], bi) : apagarLegenda();
            }
          }
          if (bi < 0) return;

          const linhas = blocos[bi].linhas;
          let vi = -1;
          for (let k = 0; k < linhas.length; k++) if (linhas[k].t <= t) vi = k; else break;
          if (vi === versoAtivo) return;
          versoAtivo = vi;

          // Janela deslizante limita a altura do bloco.
          const centro = Math.max(vi, 0);
          [...el.lyric.children].forEach((p, k) => {
            p.classList.toggle("viva", k === vi);
            p.classList.toggle("passou", k < vi);
            p.classList.toggle("fora", k < centro - ATRAS || k > centro + ADIANTE);
          });
        }

        /* ── reproducao ── */
        // Reatribuir o src reinicia o elemento e descarta qualquer busca de
        // tempo feita em seguida, entao so recarrega quando a faixa muda.
        function preparar() {
          if (!faixa) {
            faixa = new Audio();
            faixa.preload = "auto";
            faixa.addEventListener("ended", proxima);
            faixa.addEventListener("error", falhar);
            faixa.addEventListener("loadedmetadata", () => trilha.montar());
          }
          const atual = AUDIO.faixas[indice];
          if (carregada === atual.arquivo) return;
          carregada = atual.arquivo;
          cantos = [];                 // outra faixa, outras estrofes
          faixa.volume = 0;
          faixa.src = AUDIO.dir + encodeURIComponent(atual.arquivo);
          carregarLetra(arquivoDaLetra());
        }

        // Cai na original quando a faixa nao tem traducao.
        function arquivoDaLetra() {
          const atual = AUDIO.faixas[indice];
          return app.traduzido && atual.traducao ? atual.traducao : atual.letra;
        }

        // Buscar antes dos metadados nao tem efeito: nesse caso espera por eles.
        function irA(t) {
          if (faixa.readyState >= 1) faixa.currentTime = t;
          else faixa.addEventListener("loadedmetadata",
            () => { faixa.currentTime = t; }, { once: true });
        }

        function tocar() {
          preparar();
          faixa.volume = 0;
          irA(partida());
          faixa.play().then(() => esmaecer(AUDIO.volume)).catch(falhar);
        }

        function proxima() {
          indice = (indice + 1) % AUDIO.faixas.length;
          tocar();
        }

        function esmaecer(alvo, ms) {
          clearInterval(timer);
          const dur = ms || AUDIO.fade;
          const inicio = faixa ? faixa.volume : 0;
          const t0 = performance.now();
          timer = setInterval(() => {
            const k = clamp((performance.now() - t0) / dur, 0, 1);
            if (faixa) faixa.volume = clamp(inicio + (alvo - inicio) * k, 0, 1);
            if (k >= 1) clearInterval(timer);
          }, 40);
        }

        function acompanharDeNovo() {
          clearInterval(relogio);
          relogio = setInterval(acompanhar, 200);
        }

        function ligar() {
          if (tocando || !AUDIO.faixas.length) return;
          tocando = true;
          audivel = true;
          el.som.setAttribute("aria-pressed", "true");
          tocar();
          el.scrub.hidden = false;
          trilha.montar();
          acompanharDeNovo();
        }


        // Pausa: para na hora e deixa legenda e fio onde estao.
        function pausar() {
          if (!tocando) return;
          tocando = false;
          audivel = false;
          el.som.setAttribute("aria-pressed", "false");
          clearInterval(timer);
          clearInterval(relogio);
          if (faixa) faixa.pause();
        }

        function seguir() {
          if (tocando || !faixa || !faixa.src) return;
          tocando = true;
          audivel = true;
          el.som.setAttribute("aria-pressed", "true");
          faixa.volume = 0;
          faixa.play().then(() => esmaecer(AUDIO.volume)).catch(falhar);
          acompanharDeNovo();
        }

        // Falha de carregamento tira tudo de cena; pausa do visitante nao.
        function falhar() {
          tocando = false;
          audivel = false;
          el.som.setAttribute("aria-pressed", "false");
          clearInterval(timer);
          clearInterval(relogio);
          el.scrub.hidden = true;
          apagarLegenda();
          if (faixa) faixa.pause();
        }

        return {
          disponivel: () => AUDIO.faixas.length > 0,

          retomar() {
            if (tocando) return;
            if (app.som) ligar();
          },

          alternar() {
            if (tocando) { pausar(); app.som = false; return; }
            faixa && faixa.src ? seguir() : ligar();
            app.som = true;
          },

          // Troca o arquivo da letra sem tocar no audio: o tempo corre no
          // elemento, entao a proxima estrofe ja abre no idioma novo.
          traduzir(v) {
            app.traduzido = v;
            if (faixa) carregarLetra(arquivoDaLetra());
          },

          temTraducao: () => !!AUDIO.faixas[indice].traducao,

          // Enquanto o leitor esta aberto a legenda sai e a faixa recua.
          recolher(v) {
            el.lyric.classList.toggle("oculta", v);
            if (audivel) esmaecer(v ? AUDIO.volume * AUDIO.recuo : AUDIO.volume, 500);
          },

          posicao: () => ({ atual: agora() - partida(), total: duracao() - partida() }),

          irPara(p) {
            const d = duracao() - partida();
            if (d <= 0) return;
            irA(partida() + clamp(p, 0, 1) * d);
            blocoAtivo = -1;              // forca a legenda a reencontrar o trecho
            versoAtivo = -1;
            acompanhar();
          }
        };
      })();

      /* ══════════════════════════════════════════════════════════
         10 · MONTAGEM DA CENA
         ══════════════════════════════════════════════════════════ */
      function buildScene() {
        CENA.files.forEach((file, i) => {
          const l = { node: layerNode(file), depth: CENA.depths[i], aspect: 0, step: 0 };
          app.layers.push(l);
          el.scene.insertBefore(l.node, el.markers);
          // A peca so pode ser dimensionada depois que a proporcao real e conhecida.
          probe(ART + file, r => { l.aspect = r; measure(); });
        });

        // A poeira e o halo sao volume do ambiente: ficam atras do primeiro
        // plano para que o entulho os encubra. O veu cobre so os quartos.
        const frente = app.layers[CENA.poeiraAtras];
        if (frente) {
          el.scene.insertBefore(el.marca, frente.node);
          el.scene.insertBefore(el.dust, frente.node);
          el.scene.insertBefore(el.lume, frente.node);
        }
        const parede = app.layers[CENA.ancora];
        if (parede) el.scene.insertBefore(el.veu, parede.node);

        // No toque a pagina nao rola: o espacador nao precisa de altura.
      }

      function layerNode(file) {
        const d = document.createElement("div");
        d.className = "layer";
        d.style.backgroundImage = "url('" + ART + file + "')";
        return d;
      }

      function probe(url, done) {
        const im = new Image();
        im.onload = () => { if (im.naturalHeight) done(im.naturalWidth / im.naturalHeight); };
        im.src = url;
      }

      function buildMarkers() {
        app.items.forEach(f => {
          const m = document.createElement("button");
          m.type = "button";
          m.className = "marker";
          m.dataset.id = f.id;
          m.setAttribute("aria-label", f.titulo);
          m.innerHTML = '<span class="glyph"></span><span class="tag"></span>';
          m.addEventListener("click", () => show(f.id));
          m.addEventListener("pointerenter", () => luz.achar(m));
          m.addEventListener("pointerleave", () => luz.largar(m));
          el.markers.appendChild(m);

          const pip = document.createElement("i");
          pip.className = "pip";
          pip.style.left = (f.at * 100) + "%";
          el.rail.appendChild(pip);

          app.nodes.set(f.id, { marker: m, pip: pip });
        });
        refreshSeen();
      }

      function refreshSeen() {
        app.nodes.forEach((n, id) => {
          const f = app.byId.get(id);
          const seen = app.read.has(id);
          n.marker.classList.toggle("seen", seen);
          n.pip.classList.toggle("seen", seen);
          n.marker.querySelector(".tag").textContent = seen ? f.titulo : f.tipo;
        });
      }

      /* ══════════════════════════════════════════════════════════
         11 · MEDIDAS
         ══════════════════════════════════════════════════════════ */
      function measure() {
        const w = window.innerWidth, h = window.innerHeight;
        app.box.w = w;
        app.box.h = h;

        app.layers.forEach(l => {
          // A peca e alta como a tela; a largura vem da proporcao real do arquivo.
          l.step = l.aspect ? h * l.aspect : w;
          l.node.style.backgroundSize = "auto " + h + "px";
          l.node.style.width = (w + l.step) + "px";
          l.node.style.height = h + "px";
        });

        // A peca e escalada pela altura, entao numa tela estreita ela fica muito
        // maior que a janela e um percurso medido em larguras de tela cobriria so
        // um pedaco do corredor. No toque a medida passa a ser a propria peca.
        const ancora = app.layers[CENA.ancora];
        const fundo = CENA.depths[CENA.ancora] || 1;
        app.box.travel = percurso.toque && ancora && ancora.step
          ? ancora.step * CENA.voltas / fundo
          : w * CENA.reach;

        // Encurtar o espacador e o que faz a rolagem parar sozinha antes da
        // emenda, sem precisar brigar com a roda do mouse.
        const volta = app.entrou ? 1 : anterior.limite();
        el.track.style.height = percurso.toque
          ? "100vh"
          : ((1 + (CENA.span - 1) * volta) * 100) + "vh";

        anterior.medir();
        marca.dimensionar();
        acenderLampadas();
      }

      function acenderLampadas() {
        const cfg = CENA.lampada;
        const l = cfg && app.layers[cfg.camada];
        if (!l || !l.step) return;

        const quantas = Math.ceil((app.box.w + l.step) / l.step) + 1;
        while (l.node.children.length > quantas) l.node.lastChild.remove();
        while (l.node.children.length < quantas) {
          const g = document.createElement("i");
          g.className = "lampada";
          l.node.appendChild(g);
        }

        const raio = app.box.h * 0.46;
        [...l.node.children].forEach((g, k) => {
          g.style.width = g.style.height = (raio * 2) + "px";
          g.style.left = (cfg.x * l.step + k * l.step - raio) + "px";
          g.style.top = (cfg.y * app.box.h - raio) + "px";
          g.style.animationDelay = (-k * 2.3) + "s";
        });
      }

      /* ══════════════════════════════════════════════════════════
         12 · PROJECAO
         ══════════════════════════════════════════════════════════ */
      function project(p) {
        const b = app.box;
        const shift = p * b.travel;

        app.layers.forEach((l, i) => {
          // Desliza no maximo uma peca e reinicia; a repeticao esconde o salto.
          const d = l.step ? -((shift * l.depth) % l.step) : 0;
          l.node.style.transform = "translate3d(" + d + "px,0,0)";
          // A parede intacta corre junto com a arruinada: a dissolucao registra
          // em qualquer ponto do corredor, nao so no comeco.
          if (i === CENA.ancora && !app.entrou) anterior.mover(d);
        });

        // Os fragmentos acompanham a camada em que estao apoiados, senao deslizam
        // contra a parede em vez de pertencer a ela.
        const dm = CENA.depths[CENA.ancora];
        const alcance = b.travel * dm;
        poeira.mover(shift * dm);
        el.markers.style.transform = "translate3d(" + (-shift * dm) + "px,0,0)";

        app.items.forEach(f => {
          // Ancora que deixa o objeto centrado exatamente quando p == at.
          const x = f.at * alcance + b.w / 2;
          place(app.nodes.get(f.id), f, x, f.alt * b.h, focusFrom((f.at - p) * alcance, b.w));
        });
      }

      // Quanto o objeto esta perto do ponto de leitura: 0 = fora, 1 = no ponto.
      function focusFrom(offset, size) {
        return smooth(clamp(1 - Math.abs(offset) / (size * 0.3), 0, 1));
      }

      function place(n, f, x, y, focus) {
        if (!n) return;
        const live = available(f);
        const on = live && focus > 0.12;
        n.marker.style.transform = "translate3d(" + x + "px," + y + "px,0)";
        n.marker.style.opacity = live ? focus : 0;
        n.marker.style.setProperty("--f", focus.toFixed(3));
        n.marker.classList.toggle("on", on);
        n.pip.classList.toggle("near", on);
        n.pip.style.opacity = live ? 1 : 0.25;
      }

      /* ══════════════════════════════════════════════════════════
         13 · PERCURSO E LACO
         ══════════════════════════════════════════════════════════ */
      // Duas origens para o mesmo numero: no ponteiro o percurso vem da rolagem
      // vertical; no toque a pagina nao rola e o dedo arrasta a cena na horizontal.
      const percurso = (function () {
        const toque = matchMedia("(hover: none)").matches;
        const CURSO = 4;      // larguras de tela de dedo para percorrer a cena inteira
        const BORDA = 26;     // faixa lateral reservada ao gesto de voltar do sistema
        let valor = 0, arrastando = false, ultimoX = 0;

        // Denominador fixo. No estado anterior o espacador e encurtado para a
        // parede nao chegar na emenda, e normalizar pela altura viva do documento
        // esticaria o percurso curto de volta para o total.
        function rolagemCheia() {
          return Math.max(1, (CENA.span - 1) * window.innerHeight);
        }

        // Teto do percurso: a peca intacta so cobre uma volta.
        function teto() {
          return app.entrou ? 1 : anterior.limite();
        }

        // Comprimento em pixels: mantem o tempo de deslocamento igual nas duas origens.
        function extensao() {
          return toque ? window.innerWidth * CURSO : rolagemCheia();
        }

        function alvo() {
          if (toque) return valor;
          return clamp(window.scrollY / rolagemCheia(), 0, 1);
        }

        function definir(p) {
          p = clamp(p, 0, 1);
          if (toque) valor = p;
          else window.scrollTo(0, p * rolagemCheia());
        }

        function aceita(e) {
          // Durante a dissolucao o percurso fica parado: mover a parede levaria o
          // furo da ruina para fora da tela junto com ela.
          if (app.open || app.queimando) return false;
          const t = e.touches[0];
          if (t.clientX < BORDA || t.clientX > window.innerWidth - BORDA) return false;
          return !(e.target.closest && e.target.closest(".scrub, .reader, .top"));
        }

        function ligar() {
          if (!toque) return;
          el.hint.textContent = "arraste para percorrer";

          window.addEventListener("touchstart", e => {
            arrastando = e.touches.length === 1 && aceita(e);
            if (arrastando) ultimoX = e.touches[0].clientX;
          }, { passive: true });

          window.addEventListener("touchmove", e => {
            if (!arrastando || e.touches.length !== 1) return;
            const x = e.touches[0].clientX;
            // Dedo para a esquerda empurra a cena para a frente.
            valor = clamp(valor - (x - ultimoX) / (window.innerWidth * CURSO), 0, teto());
            ultimoX = x;
          }, { passive: true });

          const soltar = () => { arrastando = false; };
          window.addEventListener("touchend", soltar, { passive: true });
          window.addEventListener("touchcancel", soltar, { passive: true });
        }

        // Deslocamento proprio: o fim e conhecido, sem depender de evento do navegador.
        function irPara(p, pronto) {
          const de = alvo(), ate = clamp(p, 0, 1);
          const dist = (ate - de) * extensao();
          if (Math.abs(dist) < 4) { pronto(); return; }
          const curso = clamp(420 + Math.abs(dist) * 0.4, 420, 1600);
          const t0 = performance.now();
          (function passo(agora) {
            const k = clamp((agora - t0) / curso, 0, 1);
            const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
            definir(de + (ate - de) * e);
            if (k < 1) requestAnimationFrame(passo); else pronto();
          })(t0);
        }

        return { toque: toque, alvo: alvo, ligar: ligar, irPara: irPara };
      })();

      let ultimo = 0;

      function tick(t) {
        requestAnimationFrame(tick);
        if (!app.ready) return;

        const dt = ultimo ? Math.min((t - ultimo) / 1000, 0.1) : 1 / 60;
        ultimo = t;

        // Congelado enquanto queima: a parede em chamas esta desenhada na tela e a
        // arruinada continuaria deslizando por baixo, abrindo as duas na borda.
        if (app.queimando) app.alvo = app.p;
        else app.alvo = percurso.alvo();

        // O progresso persegue a rolagem em vez de colar nela: a cena ganha peso.
        app.p += (app.alvo - app.p) * passoDe(INERCIA, dt);
        if (Math.abs(app.alvo - app.p) < 0.00002) app.p = app.alvo;

        project(app.p);
        luz.passo(dt);
        marca.passo(dt);
        poeira.passo(dt);

        el.fill.style.width = (app.p * 100) + "%";
        el.hint.style.opacity = app.alvo > 0.02 ? 0 : 1;
      }

      /* ══════════════════════════════════════════════════════════
         14 · LEITOR
         ══════════════════════════════════════════════════════════ */
      // [[id|palavra]] vira um link para outro fragmento.
      function withLinks(line) {
        const out = document.createDocumentFragment();
        const re = /\[\[([^\|\]]+)\|([^\]]+)\]\]/g;
        let last = 0, m;
        while ((m = re.exec(line))) {
          if (m.index > last) out.append(line.slice(last, m.index));
          const id = m[1], label = m[2];   // fixados por iteracao: o handler roda depois
          const target = app.byId.get(id);
          if (target && available(target)) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "link";
            b.textContent = label;
            b.addEventListener("click", () => travel(id));
            out.append(b);
          } else {
            out.append(label);             // destino indisponivel: fica texto comum
          }
          last = re.lastIndex;
        }
        if (last < line.length) out.append(line.slice(last));
        return out;
      }

      function show(id) {
        const f = app.byId.get(id);
        if (!f || !available(f)) return;

        const again = app.read.has(id) && f.revisita && f.revisita.length;
        const lines = again ? f.revisita : f.texto;

        el.sheet.textContent = "";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = '<span class="kind"></span><span class="when"></span>';
        meta.querySelector(".kind").textContent = f.tipo || "fragmento";
        meta.querySelector(".when").textContent = f.data || "";
        if (f.rascunho) {
          const d = document.createElement("span");
          d.className = "draft";
          d.textContent = "rascunho";
          meta.appendChild(d);
        }
        el.sheet.appendChild(meta);

        const h = document.createElement("h2");
        h.id = "sheetTitle";
        h.textContent = f.titulo;
        el.sheet.appendChild(h);

        lines.forEach((line, i) => {
          const p = document.createElement("p");
          p.style.setProperty("--i", i);
          p.appendChild(withLinks(line));
          el.sheet.appendChild(p);
        });

        if (again) {
          const note = document.createElement("div");
          note.className = "again";
          note.textContent = "segunda leitura";
          el.sheet.appendChild(note);
        }

        el.sheet.scrollTop = 0;
        el.reader.classList.add("open");
        app.open = id;
        som.recolher(true);
        document.documentElement.classList.add("held");
        el.close.focus();

        if (!app.read.has(id)) {
          app.read.add(id);
          persist();
          refreshSeen();
        }
      }

      function hide() {
        el.reader.classList.remove("open");
        app.open = null;
        som.recolher(false);
        document.documentElement.classList.remove("held");
      }

      // Seguir um link percorre a cena ate o destino antes de abrir o fragmento.
      function travel(id) {
        const f = app.byId.get(id);
        if (!f) return;
        hide();
        // O leitor trava a rolagem, entao so pode abrir quando o percurso terminar.
        percurso.irPara(clamp(f.at, 0, 1), () => show(id));
      }

      /* ══════════════════════════════════════════════════════════
         15 · ESTADO ANTERIOR
         ══════════════════════════════════════════════════════════ */
      // A parede intacta, e a queima que a consome a partir do ponto tocado. O
      // mesmo gesto libera o audio, entao nao existe aviso de "ativar som".
      const anterior = (function () {
        const CURSO = 5200;

        // Carregada aqui e nao na hora da queima: um Image criado no clique ainda
        // nao decodificou e os primeiros quadros sairiam vazios.
        const arte = new Image();
        arte.src = ART + "a-novo.jpg";

        let dx = 0;

        // Ate onde da para andar antes de a peca acabar. Uma volta so.
        function limite() {
          const l = app.layers[CENA.ancora];
          const alcance = app.box.travel * (CENA.depths[CENA.ancora] || 1);
          if (!l || !l.step || !alcance) return 1;
          return clamp((l.step - window.innerWidth) / alcance, 0, 1);
        }

        function medir() {
          const l = app.layers[CENA.ancora];
          const w = window.innerWidth, h = window.innerHeight;
          el.novo.style.backgroundSize = "auto " + h + "px";
          el.novo.style.width = (l && l.step ? l.step : w) + "px";
          el.novo.style.height = h + "px";
          el.convite.textContent = percurso.toque ? "toque para entrar" : "clique para entrar";
        }

        function mover(d) {
          dx = d;
          el.novo.style.transform = "translate3d(" + d + "px,0,0)";
        }

        /* ── queima ── */
        // Ruido de valor somado em oitavas: uma so daria bolhas redondas, as
        // finas e que dao o recorte de papel.
        function ruido(pw, ph) {
          const out = new Float32Array(pw * ph);
          let amp = 1, soma = 0;
          for (let oit = 0; oit < 4; oit++) {
            const cel = Math.max(3, 48 >> oit);
            const gw = Math.ceil(pw / cel) + 2, gh = Math.ceil(ph / cel) + 2;
            const g = new Float32Array(gw * gh);
            for (let i = 0; i < g.length; i++) g[i] = Math.random();
            for (let j = 0; j < ph; j++) {
              const fy = j / cel, jy = fy | 0, ty = fy - jy;
              const sy = ty * ty * (3 - 2 * ty);
              for (let i = 0; i < pw; i++) {
                const fx = i / cel, ix = fx | 0, tx = fx - ix;
                const sx = tx * tx * (3 - 2 * tx);
                const a = g[jy * gw + ix] + (g[jy * gw + ix + 1] - g[jy * gw + ix]) * sx;
                const b = g[(jy + 1) * gw + ix] + (g[(jy + 1) * gw + ix + 1] - g[(jy + 1) * gw + ix]) * sx;
                out[j * pw + i] += amp * (a + (b - a) * sy);
              }
            }
            soma += amp; amp *= 0.5;
          }
          for (let i = 0; i < out.length; i++) out[i] /= soma;
          return out;
        }

        // Ordem em que cada ponto queima: distancia ao ponto tocado embaralhada
        // pelo ruido. Calculada uma vez; cada quadro so compara com um limiar.
        function queimar(x, y) {
          const w = window.innerWidth, h = window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const cv = el.fogo, ctx = cv.getContext("2d");
          cv.width = Math.round(w * dpr);
          cv.height = Math.round(h * dpr);

          const pw = Math.max(120, Math.round(w / 3));
          const ph = Math.max(80, Math.round(h / 3));
          const n = ruido(pw, ph);
          const campo = new Float32Array(pw * ph);
          const maxd = Math.hypot(Math.max(x, w - x), Math.max(y, h - y)) || 1;
          for (let j = 0; j < ph; j++) {
            const py = (j + 0.5) * h / ph;
            for (let i = 0; i < pw; i++) {
              const px = (i + 0.5) * w / pw;
              campo[j * pw + i] = Math.hypot(px - x, py - y) / maxd * 0.70 + n[j * pw + i] * 0.30;
            }
          }

          const pq = document.createElement("canvas");
          pq.width = pw; pq.height = ph;
          const pctx = pq.getContext("2d");
          const buraco = pctx.createImageData(pw, ph);
          const chama = pctx.createImageData(pw, ph);
          const bA = buraco.data, bB = chama.data;

          const l = app.layers[CENA.ancora];
          const larg = l && l.step ? l.step : w;

          // Faixas em unidades do campo, contadas a partir do limiar.
          const NUCLEO = 0.005, BRASA = 0.019, TICAO = 0.125, LUZ = 0.030;
          // A partir daqui so sobram os cantos: nao ha mais o que desalinhar, e
          // segurar a pagina ate o ultimo quadro so parece travamento.
          const SOLTA = 0.55;
          const t0 = performance.now();

          function soltar() {
            if (!app.queimando) return;
            app.queimando = false;
            document.documentElement.classList.remove("queimando");
          }

          (function passo(agora) {
            const k = clamp((agora - t0) / CURSO, 0, 1);
            const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
            const t = -0.04 + e * 1.18;
            // Duas senoides sem periodo comum: a brasa nao pulsa em compasso.
            const tremor = 0.74 + 0.26 * Math.sin(agora / 37) * Math.sin(agora / 89);

            for (let i = 0, p = 0; i < campo.length; i++, p += 4) {
              const v = campo[i] - t;
              if (v < 0) {
                bA[p + 3] = 255;
                // A brasa joga luz para dentro do buraco: sem isso a borda fica
                // colada, como recorte de papel em vez de fogo.
                if (v > -LUZ) {
                  const u = 1 + v / LUZ;
                  bB[p] = 255; bB[p + 1] = 176; bB[p + 2] = 96;
                  bB[p + 3] = 130 * u * u * tremor;
                } else { bB[p + 3] = 0; }
                continue;
              }
              bA[p + 3] = 0;
              if (v < NUCLEO) {
                bB[p] = 255; bB[p + 1] = 238; bB[p + 2] = 196;
                bB[p + 3] = 255 * tremor;
              } else if (v < BRASA) {
                const u = (v - NUCLEO) / (BRASA - NUCLEO);
                bB[p] = 255; bB[p + 1] = 152 - 62 * u; bB[p + 2] = 44 - 32 * u;
                bB[p + 3] = 252 * (1 - u) * tremor;
              } else if (v < TICAO) {
                const u = (v - BRASA) / (TICAO - BRASA);
                bB[p] = 30; bB[p + 1] = 17; bB[p + 2] = 11;
                bB[p + 3] = 247 * Math.pow(1 - u, 1.5);
              } else { bB[p + 3] = 0; }
            }

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.globalCompositeOperation = "source-over";
            ctx.clearRect(0, 0, w, h);
            if (arte.complete && arte.naturalWidth) ctx.drawImage(arte, dx, 0, larg, h);

            pctx.putImageData(buraco, 0, 0);
            ctx.globalCompositeOperation = "destination-out";
            ctx.drawImage(pq, 0, 0, w, h);

            pctx.putImageData(chama, 0, 0);
            ctx.globalCompositeOperation = "source-over";
            ctx.drawImage(pq, 0, 0, w, h);

            if (k > SOLTA) soltar();
            if (k < 1) requestAnimationFrame(passo);
            else {
              el.fogo.hidden = true;
              soltar();
            }
          })(t0);
        }

        function entrar(x, y) {
          if (app.entrou || !app.ready) return;
          app.entrou = true;
          app.queimando = true;
          document.documentElement.classList.remove("antes");
          document.documentElement.classList.add("queimando");
          luz.acender(x, y);
          measure();                     // devolve o espacador inteiro
          el.fogo.hidden = false;
          el.novo.hidden = true;         // daqui em diante quem desenha e a tela
          queimar(x, y);
        }

        return { limite: limite, medir: medir, mover: mover, entrar: entrar };
      })();

      /* ══════════════════════════════════════════════════════════
         16 · INICIO
         ══════════════════════════════════════════════════════════ */
      function bind() {
        percurso.ligar();

        window.addEventListener("resize", () => {
          measure();
          poeira.redimensionar();
          if (!el.scrub.hidden) trilha.montar();
        });

        el.close.addEventListener("click", hide);
        el.reader.addEventListener("click", e => { if (e.target === el.reader) hide(); });

        el.som.addEventListener("click", () => som.alternar());

        // Gatilho discreto da traducao. Fora enquanto queima: o clique que
        // entrou na pagina nao deve trocar o idioma junto.
        function alternarIdioma() {
          if (!app.entrou || app.queimando || !som.temTraducao()) return;
          som.traduzir(!app.traduzido);
          el.title.setAttribute("aria-pressed", app.traduzido ? "true" : "false");
        }
        el.title.addEventListener("click", alternarIdioma);
        el.title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); alternarIdioma(); }
        });

        // A porta e a unica origem do som: antes dela nada toca, senao a musica
        // comecaria enquanto o visitante so olha em volta. Depois de entrar,
        // qualquer gesto tenta de novo, porque a primeira tentativa pode ser
        // recusada. O botao de som fica de fora: o gesto abriria o volume e o
        // clique o cortaria.
        function liberar(x, y) {
          anterior.entrar(x, y);
          if (app.entrou) som.retomar();
        }

        ["pointerdown", "keydown"].forEach(ev =>
          window.addEventListener(ev, e => {
            if (e.target && el.som.contains(e.target)) return;
            if (e.pointerType === "touch") return;
            liberar(
              e.clientX != null ? e.clientX : window.innerWidth / 2,
              e.clientY != null ? e.clientY : window.innerHeight / 2);
          }, { passive: true }));

        // No toque o arrasto percorre o corredor intacto, entao so um toque parado
        // entra. Um dedo so, e sempre com a lista de toques conferida: sem isso
        // 'andou' congela em zero e um arrasto acaba abrindo a porta no meio.
        let toqueX = 0, toqueY = 0, andou = 0, valido = false;
        window.addEventListener("touchstart", e => {
          valido = e.touches.length === 1;
          if (!valido) return;
          toqueX = e.touches[0].clientX;
          toqueY = e.touches[0].clientY;
          andou = 0;
        }, { passive: true });
        window.addEventListener("touchmove", e => {
          if (!valido || e.touches.length !== 1) { valido = false; return; }
          const t = e.touches[0];
          andou = Math.max(andou, Math.hypot(t.clientX - toqueX, t.clientY - toqueY));
        }, { passive: true });
        window.addEventListener("touchend", e => {
          if (e.touches.length) return;
          if (valido && andou <= 10) liberar(toqueX, toqueY);
          valido = false;
        }, { passive: true });
        window.addEventListener("touchcancel", () => { valido = false; }, { passive: true });

        document.addEventListener("keydown", e => {
          if (e.key === "Escape" && app.open) hide();
        });
      }

      function fail(err) {
        const n = document.createElement("div");
        n.className = "notice";
        n.innerHTML =
          "<div>nao foi possivel ler os fragmentos<br><br>" +
          "abra a pagina por um servidor, nao por duplo clique<br>" +
          "<code>npx serve .</code><br><br>" +
          "<span style='opacity:.5'>" + String(err && err.message || err) + "</span></div>";
        document.body.appendChild(n);
      }

      (async function start() {
        document.documentElement.classList.add("antes");
        restore();

        try {
          await load();
        } catch (err) {
          el.veil.classList.add("gone");
          fail(err);
          return;
        }

        buildScene();
        buildMarkers();
        measure();
        bind();

        // A poeira e a unica peca que roda sozinha o tempo todo; fica de fora
        // de quem pediu menos movimento.
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) poeira.iniciar();
        // Nada toca aqui: quem libera o audio e o gesto que abre a porta.
        if (som.disponivel()) el.som.hidden = false;

        app.ready = true;
        tick();
        requestAnimationFrame(() => el.veil.classList.add("gone"));
      })();

    })();
  </script>
</body>

</html>
